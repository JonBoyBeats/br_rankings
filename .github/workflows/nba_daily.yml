name: NBA daily record
# Started at 2:17am and 8:17pm Pacific by a Claude scheduled task (GitHub's own cron runs hours
# late here, or not at all); the schedule below is only a fallback. Running twice does no harm.
on:
  schedule:
    # UTC: 2:17am PT in daylight time, 1:17am in standard. Every game is final by then.
    - cron: '17 9 * * *'
    # 8:17pm PT (7:17 in standard): tomorrow's Recent notes only, from every game already in, so the
    # next day's slate has them the night before; the 2:17am run refreshes anyone who played tonight
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      evening: { description: "The 8pm run: only tomorrow's Recent notes", type: boolean, default: false }
      notes_for: { description: "Only write that day's Recent notes (YYYY-MM-DD), skipping the nightly record", required: false }
      since: { description: 'Build from this Pacific day (YYYY-MM-DD); default three days back', required: false }
      rebuild: { description: 'Rewrite slates already on file', type: boolean, default: false }
permissions:
  contents: write
concurrency:          # one run at a time: a manual rebuild waits for a running job (GitHub keeps one pending run per group)
  group: analysis
  cancel-in-progress: false
env:
  GIST_ID: ${{ secrets.GIST_ID }}   # repository secret: your board's gist; without it, no ETR, our Proj or final ranks
  SINCE: ${{ inputs.since }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: ADP mirror and gist history
        run: |
          FROM=$(date -u -d "${SINCE:-today} -7 days" +%F)
          git clone -q --shallow-since="$FROM" https://github.com/JonBoyBeats/br-adp-mirror ../br-adp-mirror
          if [ -n "$GIST_ID" ]; then git clone -q --shallow-since="$FROM" "https://gist.github.com/$GIST_ID.git" ../gist; fi
      # Last night's contest rosters first: the daily record reads your first AM draft from them (the AM lock's cutoff)
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        name: Contests pull
        continue-on-error: true
        run: python3 scripts/nba_contests.py pull --mirror ../br-adp-mirror
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        run: |
          python3 scripts/nba_daily.py --mirror ../br-adp-mirror \
            $([ -d ../gist ] && echo --gist ../gist) \
            ${SINCE:+--since "$SINCE"} ${{ inputs.rebuild && '--rebuild' || '' }}
      # Our morning Proj against ETR's first upload, read against ADP (scripts/nba_etr_match.py)
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        name: ETR match
        continue-on-error: true
        run: python3 scripts/nba_etr_match.py --mirror ../br-adp-mirror > /dev/null
      # Every ETR scenario file from the gist's history, next to the main file it came with (scripts/nba_etr_scenarios.py):
      # analysis/nba/daily/etr_scenarios.csv, for the study of the out bump against ETR's own
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        name: ETR scenarios
        continue-on-error: true
        run: if [ -d ../gist ]; then python3 scripts/nba_etr_scenarios.py --gist ../gist; fi
      # College basketball: every CBB slate's projection at lock against the box scores
      # (scripts/cbb_daily.py), then the running grade in the log. Must not hold up the NBA.
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        name: CBB record
        continue-on-error: true
        run: |
          python3 scripts/cbb_daily.py record --mirror ../br-adp-mirror ${SINCE:+--since "$SINCE"} ${{ inputs.rebuild && '--rebuild' || '' }}
          python3 scripts/cbb_daily.py report
      # College contests: every settled tournament on last night's CBB main slate, then its field measures
      # (scripts/nba_contests.py --sport cbb), from the CBB record above for names, closing ADP and points.
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        name: CBB contests
        continue-on-error: true
        run: |
          python3 scripts/nba_contests.py pull --sport cbb --mirror ../br-adp-mirror
          python3 scripts/nba_contests.py measures --sport cbb --mirror ../br-adp-mirror --date "$(TZ=America/Los_Angeles date -d yesterday +%F)"
      # Every main-slate contest that has settled (contest ids from the ADP poller's lobby capture): each team's
      # picks, place and payout, then the night's field measures. A failure here must not hold up the notes.
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        name: Contests
        continue-on-error: true
        run: |
          python3 scripts/nba_contests.py measures --mirror ../br-adp-mirror --date "$(TZ=America/Los_Angeles date -d yesterday +%F)"
          python3 scripts/nba_contests.py model
          # the Live page's lineup chances replayed on last night's flagship, against how they finished
          pip install -q numpy && python3 scripts/nba_live_calibration.py --mirror ../br-adp-mirror
      # The morning report's Field section (scripts/nba_field.py): the contest summary on top, the full tables as
      # reference, and last night's forward-test numbers into forward_tests.json. Boom reads the mirror's full history.
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        name: Field
        continue-on-error: true
        run: |
          git -C ../br-adp-mirror fetch -q --unshallow || true
          python3 scripts/nba_field.py --mirror ../br-adp-mirror --out analysis/nba/report/field.md > /dev/null
      # The tiers: the Tiers button rebuilt at every lock (tier_history.csv), every swap read from the contests (swaps.csv),
      # the shadow orders: each replaced rule and each candidate graded against the button (shadow.md), then the money
      # report and the morning report (today.md)
      - if: github.event.schedule != '17 3 * * *' && !inputs.notes_for && !inputs.evening
        name: Tiers
        continue-on-error: true
        run: |
          python3 scripts/nba_tier_history.py --mirror ../br-adp-mirror > /dev/null
          python3 scripts/nba_swaps.py > /dev/null
          python3 scripts/nba_tier_takes.py > /dev/null
          python3 scripts/nba_shadow.py > /dev/null
          python3 scripts/nba_swap_board.py > /dev/null
          python3 scripts/nba_my_swaps.py > /dev/null
          # the contest side's money report: refreshes money_report.md and money_tiers.json (and money_proposals.json on
          # Mondays), never decision_register.csv; after tier_history so last night's tiers and exposure are in
          python3 scripts/nba_money.py --mirror ../br-adp-mirror > /dev/null || true
          python3 scripts/nba_tier_report.py --mirror ../br-adp-mirror > /dev/null || true
      # Today's Recent notes: last night into the ledger, a fresh note for everyone on today's
      # slates who has played since his last one, then the board's notes file
      - name: Recent notes
        env:
          NOTES_FOR: ${{ inputs.notes_for }}
          EVENING: ${{ github.event.schedule == '17 3 * * *' || inputs.evening }}
        run: |
          if [ "$EVENING" = true ]; then NOTES_FOR=$(TZ=America/Los_Angeles date -d tomorrow +%F); fi
          python3 scripts/nba_ledger.py auto --slates ../br-adp-mirror/nba_latest.json ${NOTES_FOR:+--date "$NOTES_FOR"}
          python3 scripts/build_takes.py
      # Commit and push. The workflow owns every file it regenerates (OWNED below); decision_register.csv is chat-only and
      # never written here. If a chat committed one of the owned files while this ran, the push's rebase conflicts on it:
      # this run's copy stands (it was just regenerated), the fast steps run again on top of what was pulled (any code or
      # inputs a chat pushed meanwhile), and the push is retried, three times at most.
      - run: |
          git config user.name "analysis-bot"; git config user.email "analysis-bot@users.noreply.github.com"
          mkdir -p analysis/cbb/daily analysis/cbb/contests
          OWNED="analysis/cbb/daily analysis/cbb/contests analysis/nba/daily analysis/nba/ledger.csv analysis/nba/form.csv analysis/nba/takes analysis/*.json analysis/nba/contests analysis/nba/report/etr_match.md analysis/nba/report/field.md analysis/nba/report/forward_tests.json analysis/nba/report/tier_history.csv analysis/nba/report/swaps.csv analysis/nba/report/shadow.md analysis/nba/report/shadow.csv analysis/nba/report/shadow.json analysis/nba/report/takes_history.csv analysis/nba/report/swap_board.md analysis/nba/report/my_swaps.md analysis/nba/contests/tips.json analysis/nba/report/money_report.md analysis/nba/report/money_tiers.json analysis/nba/report/money_proposals.json analysis/nba/report/today.md"
          git checkout -- analysis/nba/report/decision_register.csv 2>/dev/null || true
          git add $OWNED
          git diff --cached --quiet && exit 0
          git commit -q -m "NBA daily: record and Recent notes through $(TZ=America/Los_Angeles date -d yesterday +%F)"
          for try in 1 2 3; do
            if git pull --rebase -q origin main; then
              git push && exit 0
              continue
            fi
            echo "::warning::push conflict on files this workflow owns (try $try): keeping this run's copy, regenerating on top"
            for f in $(git diff --name-only --diff-filter=U); do git checkout --theirs -- "$f"; git add "$f"; done
            GIT_EDITOR=true git rebase --continue
            python3 scripts/nba_tier_history.py --mirror ../br-adp-mirror > /dev/null
            python3 scripts/nba_swaps.py > /dev/null
            python3 scripts/nba_tier_takes.py > /dev/null
            python3 scripts/nba_shadow.py > /dev/null
            python3 scripts/nba_swap_board.py > /dev/null
            python3 scripts/nba_my_swaps.py > /dev/null
            python3 scripts/nba_tier_report.py --mirror ../br-adp-mirror > /dev/null || true
            git checkout -- analysis/nba/report/decision_register.csv 2>/dev/null || true
            git add $OWNED
            git diff --cached --quiet || git commit -q -m "NBA daily: regenerated on top of a chat's commit"
          done
          echo "::error::could not push after 3 tries"; exit 1
