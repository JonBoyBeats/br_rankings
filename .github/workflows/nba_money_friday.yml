name: NBA money Friday
# The contest side's Friday tests (scripts/nba_money_friday.py -> analysis/nba/report/money_friday.json), which the rankings
# side's Friday report (nba_friday.yml) reads. Kept out of the nightly so its runtime doesn't grow. Starts when the nightly
# record finishes (GitHub's own cron runs hours late here) and goes on only on a Friday morning, Pacific; or by hand.
on:
  workflow_run:
    workflows: ["NBA daily record"]
    types: [completed]
  workflow_dispatch:
    inputs:
      monthly: { description: 'Also rerun the monthly tests (edge by tier, duds and smashes)', type: boolean, default: false }
permissions:
  contents: write
concurrency:
  group: analysis
  cancel-in-progress: false
jobs:
  money:
    runs-on: ubuntu-latest
    steps:
      - id: when
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          day=$(TZ=America/Los_Angeles date +%u); hour=$(TZ=America/Los_Angeles date +%H)
          if [ "${{ github.event.workflow_run.conclusion }}" = success ] && [ "$day" = 5 ] && [ "$hour" -lt 12 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.when.outputs.go == 'true'
        uses: actions/checkout@v4
        with: { ref: main }
      - if: steps.when.outputs.go == 'true'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - if: steps.when.outputs.go == 'true'
        name: Friday money tests
        run: |
          git clone -q https://github.com/JonBoyBeats/br-adp-mirror ../br-adp-mirror
          python3 scripts/nba_money_friday.py --mirror ../br-adp-mirror ${{ inputs.monthly && '--monthly' || '' }}
      - if: steps.when.outputs.go == 'true'
        run: |
          git config user.name "analysis-bot"; git config user.email "analysis-bot@users.noreply.github.com"
          git add analysis/nba/report/money_friday.json analysis/nba/contests/tags
          git diff --cached --quiet && exit 0
          git commit -q -m "NBA money Friday: contest results through $(TZ=America/Los_Angeles date -d yesterday +%F)"
          for try in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::could not push after 3 tries"; exit 1
