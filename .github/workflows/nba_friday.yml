name: NBA Friday report
# The Friday report (scripts/nba_friday.py -> analysis/nba/report/friday.md): its own job after the nightly record, so
# it never delays the morning notes. Started on Fridays after the 2:17am record; the schedule below is a fallback
# (GitHub's cron runs hours late here). Running twice does no harm.
on:
  schedule:
    - cron: '47 12 * * 5'     # Fridays, 4:47am PT in daylight time (3:47 in standard)
  workflow_dispatch:
permissions:
  contents: write
concurrency:          # shares the nightly record's group, so the two never push at once
  group: analysis
  cancel-in-progress: false
jobs:
  friday:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: ADP mirror
        run: git clone -q --shallow-since="$(date -u -d '-7 days' +%F)" https://github.com/JonBoyBeats/br-adp-mirror ../br-adp-mirror
      - name: Friday report
        run: python3 scripts/nba_friday.py --mirror ../br-adp-mirror > /dev/null
      - run: |
          git config user.name "analysis-bot"; git config user.email "analysis-bot@users.noreply.github.com"
          git add analysis/nba/report/friday.md analysis/nba/report/gallagher_arrows.csv
          git diff --cached --quiet && exit 0
          git commit -q -m "NBA Friday report $(TZ=America/Los_Angeles date +%F)"
          for try in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 10
          done
          exit 1
