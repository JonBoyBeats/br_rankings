<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* The board's dark theme; chart colours from the dataviz reference palette's dark steps, validated on --surface
     (#3987e5 / #d95926 / #e66767: all checks pass). Field baselines are gray; text never wears a series colour. */
  :root {
    color-scheme: dark;
    --bg: #080b11; --surface: #12151c; --surface-2: #161a22;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #8b94a4;
    --line: #1c212c; --line-strong: #2a3140; --grid: #232836; --axis: #383d4a;
    --accent: #ffffff;
    --me: #3987e5;        /* you (series 1) */
    --alt: #d95926;       /* the second series (series 2) */
    --neg: #e66767;       /* below zero */
    --field: #8b94a4;     /* the field's baseline */
    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .shell { max-width: 980px; margin: 0 auto; padding: 0 16px 64px; }
  .masthead { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: 14px; }
  .mast-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; margin: 0; white-space: nowrap; }
  .views { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; align-self: center; flex-wrap: wrap; }
  .views a { font-size: 12.5px; font-weight: 600; padding: 5px 12px; color: var(--muted); text-decoration: none; }
  .views a[aria-current="page"] { background: var(--accent); color: var(--bg); }
  .views a:not([aria-current]):hover { color: var(--ink); }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 0; }
  .controls button { font-family: var(--sans); font-size: 13px; font-weight: 500; border-radius: 7px; border: 1px solid var(--line-strong);
                     background: var(--surface); color: var(--ink); padding: 6px 12px; cursor: pointer; }
  .controls button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .seg { display: inline-flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
  .seg button { font-family: var(--sans); font-size: 12.5px; font-weight: 500; border-radius: 7px; border: 1px solid var(--line-strong);
                background: var(--surface-2); color: var(--ink); padding: 5px 11px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .pod-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .pod-cols { grid-template-columns: 1fr; } }
  .status { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-bottom: 10px; }
  section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
  section.card h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .def { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
  .sub { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 14px 0 4px; }
  .note { font-size: 12.5px; color: var(--ink-2); margin: 6px 0 0; }
  .wait { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; margin: 6px 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .tile .vs { font-size: 12px; color: var(--ink-2); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 4px 0 6px; }
  .legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .legend i.ln { height: 2px; border-radius: 1px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  svg .hit { fill: transparent; cursor: default; }
  svg .bar:hover, svg .bar.on { filter: brightness(1.25); }
  details { margin-top: 6px; }
  details summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  table { border-collapse: collapse; font-size: 12px; margin-top: 6px; width: 100%; }
  th, td { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; }
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 7px;
         padding: 6px 9px; font-size: 12px; max-width: 280px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #tip b { display: block; font-size: 13px; }
  #tip span { color: var(--ink-2); }
  @media (max-width: 560px) { .tile .value { font-size: 19px; } .views a { padding: 5px 8px; font-size: 12px; } }
</style>
</head>
<body>
<div class="shell">
  <div class="masthead">
    <div class="mast-row">
      <h1>NBA Results</h1>
      <nav id="sitenav" data-sport="nba" data-page="results"></nav><script src="sitenav.js"></script>
    </div>
    <div class="controls" role="group" aria-label="Range">
      <button type="button" data-range="night" aria-pressed="false">Last night</button>
      <button type="button" data-range="7" aria-pressed="false">Last 7 nights</button>
      <button type="button" data-range="season" aria-pressed="true">Season</button>
    </div>
    <div class="status" id="status">Loading&hellip;</div>
  </div>
  <div id="main"></div>
</div>
<div id="tip" hidden></div>
<script>
"use strict";
var D = null, RANGE = "season";
try { RANGE = localStorage.getItem("nbaResultsRange") || "season"; } catch (e) { /* storage blocked */ }
var $ = function (id) { return document.getElementById(id); };
var NS = "http://www.w3.org/2000/svg";

function el(tag, attrs, parent, text) {
  var e = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function sv(tag, attrs, parent, text) {
  var e = document.createElementNS(NS, tag);
  Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function fmt(x, d) { return x == null || isNaN(x) ? "–" : (+x).toFixed(d == null ? 2 : d); }
function pct(x, d) { return x == null || isNaN(x) ? "–" : (100 * x).toFixed(d == null ? 0 : d) + "%"; }
function sgn(x, d) { return x == null || isNaN(x) ? "–" : (x > 0 ? "+" : "") + (+x).toFixed(d == null ? 2 : d); }
function short(d) { var p = d.split("-"); return +p[1] + "/" + +p[2]; }

// ---- tooltip (values lead, labels follow; textContent only)
function tipShow(ev, lines) {
  var t = $("tip");
  t.textContent = "";
  lines.forEach(function (l, i) { el(i ? "span" : "b", {}, t, l); if (i) el("br", {}, t); });
  t.hidden = false;
  var x = Math.min(ev.clientX + 14, window.innerWidth - t.offsetWidth - 8), y = ev.clientY + 14;
  if (y + t.offsetHeight > window.innerHeight - 8) y = ev.clientY - t.offsetHeight - 10;
  t.style.left = x + "px"; t.style.top = y + "px";
}
function tipHide() { $("tip").hidden = true; }
function hover(node, lines) {
  node.setAttribute("tabindex", "0");
  node.addEventListener("pointermove", function (ev) { tipShow(ev, lines()); });
  node.addEventListener("pointerleave", tipHide);
  node.addEventListener("focus", function () { var r = node.getBoundingClientRect(); tipShow({ clientX: r.right, clientY: r.top }, lines()); });
  node.addEventListener("blur", tipHide);
}

// ---- the range: last night, the last 7 nights, the season (nights you played)
function played() { return D.nights.filter(function (n) { return n.header.entries > 0; }); }
function inRange() {
  var p = played();
  return RANGE === "night" ? p.slice(-1) : RANGE === "7" ? p.slice(-7) : p;
}
function rangeLabel() { return RANGE === "night" ? "last night (" + short(played().slice(-1)[0].date) + ")" : RANGE === "7" ? "the last 7 nights" : "the season"; }

// ---- charts
/** Round ticks (1, 2, 5 x 10^k) covering [lo, hi], about four of them. */
function cw(parent) { return Math.max(300, Math.round(parent.getBoundingClientRect().width || 900)); }
function niceTicks(lo, hi) {
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  var raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = [1, 2, 5, 10].map(function (k) { return k * mag; }).filter(function (k) { return k >= raw; })[0];
  var out = [];
  for (var v = Math.floor(lo / st) * st; v <= hi + st * 1e-9; v += st) out.push(Math.round(v / st) * st);
  if (out[out.length - 1] < hi) out.push(out[out.length - 1] + st);
  return out;
}
/** The running total of per-night values, as one line on its own axis (never a second axis on the columns). */
function runningTotal(parent, items, dec, unit) {
  var pts = [], tot = 0;
  items.forEach(function (d, i) { if (d.value != null) { tot += d.value; pts.push([i, tot, d.label]); } });
  if (pts.length < 2) return;
  var tk = niceTicks(Math.min(0, Math.min.apply(null, pts.map(function (p) { return p[1]; }))), Math.max(0, Math.max.apply(null, pts.map(function (p) { return p[1]; }))));
  el("div", { class: "note" }, parent, "Running total, " + rangeLabel() + ": " + sgn(tot, dec) + unit);
  var nx = Math.max(1, items.length - 1);
  lines(parent, [{ name: "Running total", color: "var(--me)", points: pts.map(function (p) { return [p[0], p[1]]; }), dot: true }],
    { h: 130, aria: "Running total", x: [0, nx], y: [tk[0], tk[tk.length - 1]], yticks: tk, yfmt: function (v) { return sgn(v, dec); },
      xticks: [[0, items[0].label], [nx, items[items.length - 1].label]],
      snap: function (v) { var best = pts[0]; pts.forEach(function (p) { if (Math.abs(p[0] - v) < Math.abs(best[0] - v)) best = p; }); return best[0]; },
      tip: function (x) { var p = pts.filter(function (q) { return q[0] === x; })[0]; return [sgn(p[1], dec) + unit, "running total through " + p[2]]; } });
}
/** Per-night columns around zero (one axis), positive in --me, negative in --neg; marks below the axis label which
    side you took. items: [{label, value, tip: [..], mark}] */
function columns(parent, items, opts) {
  var W = cw(parent), H = 190, L = 44, R = 8, T = 10, B = 34;
  var vals = items.map(function (d) { return d.value; }).filter(function (v) { return v != null; });
  var tk = niceTicks(Math.min(0, Math.min.apply(null, vals.concat([0]))), Math.max(0, Math.max.apply(null, vals.concat([0])))), lo = tk[0], hi = tk[tk.length - 1];
  var y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
  var svg = sv("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.aria || "" }, parent);
  tk.forEach(function (v) {
    sv("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    sv("text", { x: L - 6, y: y(v) + 3, "text-anchor": "end" }, svg, sgn(v, opts.dec == null ? 2 : opts.dec));
  });
  sv("line", { x1: L, x2: W - R, y1: y(0), y2: y(0), stroke: "var(--field)", "stroke-width": 2 }, svg);
  var n = items.length, band = (W - L - R) / Math.max(n, 1), bw = Math.min(24, band * 0.6);
  items.forEach(function (d, i) {
    var cx = L + band * (i + 0.5), g = sv("g", {}, svg);
    if (d.value != null) {
      var y0 = y(0), y1 = y(d.value), top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0)), r = Math.min(4, h / 2);
      var up = d.value >= 0, x0 = cx - bw / 2;
      // 4px rounded data end, square at the baseline
      var path = up ? "M" + x0 + "," + (top + h) + "V" + (top + r) + "Q" + x0 + "," + top + " " + (x0 + r) + "," + top + "H" + (x0 + bw - r) +
                      "Q" + (x0 + bw) + "," + top + " " + (x0 + bw) + "," + (top + r) + "V" + (top + h) + "Z"
                    : "M" + x0 + "," + top + "V" + (top + h - r) + "Q" + x0 + "," + (top + h) + " " + (x0 + r) + "," + (top + h) + "H" + (x0 + bw - r) +
                      "Q" + (x0 + bw) + "," + (top + h) + " " + (x0 + bw) + "," + (top + h - r) + "V" + top + "Z";
      sv("path", { d: path, fill: up ? "var(--me)" : "var(--neg)", class: "bar" }, g);
    }
    var step = Math.ceil(n / Math.max(4, Math.floor(W / 64)));
    if ((i % step === 0 && n - 1 - i >= step) || i === n - 1) sv("text", { x: cx, y: H - B + 13, "text-anchor": "middle" }, svg, d.label);
    if (d.mark) sv("text", { x: cx, y: H - 6, "text-anchor": "middle", style: "fill: var(--ink-2)" }, svg, d.mark);
    var hit = sv("rect", { x: cx - band / 2, y: T, width: band, height: H - T - B, class: "hit" }, g);
    hover(hit, function () { return d.tip; });
  });
  return svg;
}

/** Lines on one axis. series: [{name, color, points: [[x, y]], width}], x and y domains given. */
function lines(parent, series, opts) {
  var W = cw(parent), H = opts.h || 200, L = 44, R = 10, T = 10, B = 26;
  var x = function (v) { return L + (v - opts.x[0]) / (opts.x[1] - opts.x[0]) * (W - L - R); };
  var y = function (v) { return T + (opts.y[1] - v) / (opts.y[1] - opts.y[0]) * (H - T - B); };
  var svg = sv("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": opts.aria || "" }, parent);
  opts.yticks.forEach(function (v) {
    sv("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    sv("text", { x: L - 6, y: y(v) + 3, "text-anchor": "end" }, svg, opts.yfmt(v));
  });
  opts.xticks.forEach(function (t) { sv("text", { x: x(t[0]), y: H - 8, "text-anchor": "middle" }, svg, t[1]); });
  series.forEach(function (s) {
    if (!s.points.length) return;
    sv("path", { d: s.points.map(function (p, i) { return (i ? "L" : "M") + x(p[0]) + "," + y(p[1]); }).join(""), fill: "none",
                 stroke: s.color, "stroke-width": s.width || 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    var last = s.points[s.points.length - 1];
    if (s.dot) sv("circle", { cx: x(last[0]), cy: y(last[1]), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }, svg);
  });
  // crosshair + one tooltip with every series at that x
  var cross = sv("line", { y1: T, y2: H - B, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" }, svg);
  var hit = sv("rect", { x: L, y: T, width: W - L - R, height: H - T - B, class: "hit" }, svg);
  hit.addEventListener("pointermove", function (ev) {
    var b = svg.getBoundingClientRect(), vx = opts.x[0] + ((ev.clientX - b.left) / b.width * W - L) / (W - L - R) * (opts.x[1] - opts.x[0]);
    var xs = opts.snap(vx);
    cross.setAttribute("x1", x(xs)); cross.setAttribute("x2", x(xs)); cross.setAttribute("visibility", "visible");
    tipShow(ev, opts.tip(xs));
  });
  hit.addEventListener("pointerleave", function () { cross.setAttribute("visibility", "hidden"); tipHide(); });
  return svg;
}

function legend(parent, items) {
  var lg = el("div", { class: "legend" }, parent);
  items.forEach(function (it) { var s = el("span", {}, lg); el("i", { class: it.line ? "ln" : "", style: "background:" + it.color }, s); s.appendChild(document.createTextNode(it.name)); });
}
function table(parent, head, rows) {
  var d = el("details", {}, parent); el("summary", {}, d, "Table");
  var t = el("table", {}, d), tr = el("tr", {}, el("thead", {}, t));
  head.forEach(function (h) { el("th", {}, tr, h); });
  var tb = el("tbody", {}, t);
  rows.forEach(function (r) { var tr2 = el("tr", {}, tb); r.forEach(function (c) { el("td", {}, tr2, c); }); });
}
function card(title, def) {
  var s = el("section", { class: "card" }, $("main"));
  el("h2", {}, s, title);
  if (def) el("p", { class: "def" }, s, def);
  return s;
}
function wait(parent, what) { el("div", { class: "wait" }, parent, "Waiting on the contest side: " + what + "."); }

// ---- 0. header
function header() {
  var ns = inRange(), s = card("Results", D.defs.header);
  var sum = function (k) { return ns.reduce(function (a, n) { return a + n.header[k]; }, 0); };
  var ent = sum("entries"), fees = sum("fees"), won = sum("won"), cash = sum("cashed"), t10 = sum("top10"), t1 = sum("top1");
  var fcash = ns.reduce(function (a, n) { return a + (n.header.field_cash_rate || 0) * n.header.entries; }, 0) / (ent || 1);
  var tiles = el("div", { class: "tiles" }, s);
  [["Entries", String(ent), ns.length + " night" + (ns.length === 1 ? "" : "s")],
   ["Cash rate", pct(cash / ent, 1), "field " + pct(fcash, 1)],
   ["Top 10%", String(t10), "expected " + fmt(ent * 0.10, 1) + " (" + fmt(t10 / (ent * 0.10 || 1), 2) + "x)"],
   ["Top 1%", String(t1), "expected " + fmt(ent * 0.01, 1) + " (" + fmt(t1 / (ent * 0.01 || 1), 2) + "x)"],
   ["ROI", sgn(100 * (won - fees) / (fees || 1), 1) + "%", "$" + fmt(won, 0) + " back on $" + fmt(fees, 0)]].forEach(function (t) {
    var d = el("div", { class: "tile" }, tiles); el("div", { class: "label" }, d, t[0]); el("div", { class: "value" }, d, t[1]); el("div", { class: "vs" }, d, t[2]);
  });
  table(s, ["Night", "Entries", "Cashed", "Top 10%", "Top 1%", "Fees", "Won"], ns.map(function (n) {
    var h = n.header; return [n.date, h.entries, h.cashed, h.top10, h.top1, "$" + fmt(h.fees, 0), "$" + fmt(h.won, 0)];
  }));
}

// ---- 0b. pod replay: the main read on whether your moves help (season and since the rules; not tied to the range buttons)
var POD_W = "both";
try { POD_W = localStorage.getItem("nbaPodWindow") || "both"; } catch (e) { /* storage blocked */ }
var POD_ROWS = [["b", "vs the button"], ["c1", "Tier 1 moves"], ["c2", "Tier 2 moves"], ["c3", "Tier 3 moves"], ["c4", "Tier 4 moves"],
                ["c5", "Tier 5 moves"], ["d", "vs ADP"], ["e", "vs ETR (PM)"]];
function podSince(lst, w) {
  var x = (D.pod_replay.since || {})[lst] || {};
  return w === "both" ? [x.pm && "PM " + short(x.pm), x.am && "AM " + short(x.am)].filter(Boolean).join(", ") : x[w] ? short(x[w]) : null;
}
function podReplay() {
  var s = card("Pod replay: does your list beat the others?", D.defs.pod), P = D.pod_replay;
  if (!P) { wait(s, "the pod replay (pod_replay.json)"); return; }
  var seg = el("div", { class: "seg", role: "group", "aria-label": "Window" }, s);
  [["both", "Both windows"], ["am", "AM"], ["pm", "PM"]].forEach(function (b) {
    var bt = el("button", { type: "button", "aria-pressed": String(POD_W === b[0]) }, seg, b[1]);
    bt.addEventListener("click", function () { POD_W = b[0]; try { localStorage.setItem("nbaPodWindow", POD_W); } catch (e) { /* storage blocked */ } render(); });
  });
  var R = P.rows[POD_W] || {}, mine = (P.mine || {})[POD_W] || {};
  var rows = POD_ROWS.filter(function (r) { return R[r[0]]; }).map(function (r) {
    var x = R[r[0]];
    return { key: r[0], label: r[1], top10: x.top10, top1: x.top1, since: podSince(r[0], POD_W) };
  });
  el("p", { class: "note" }, s, "Your locked list, replayed: top 10% in " + fmt(mine.top10, 1) + "% of seats (the field: 10%), top 1% in " +
     fmt(mine.top1, 2) + "% (the field: 1%), " + (mine.nights || 0) + " nights through " + (P.through ? short(P.through) : "–") +
     ". Each row: your list minus that list, in percentage points; right of zero, yours did better.");
  legend(s, [{ name: "Season", color: "var(--me)" }, { name: "Since the rules went in", color: "var(--alt)" }, { name: "80% range", color: "var(--ink-2)", line: true },
             { name: "Zero: no difference", color: "var(--field)", line: true }]);
  var sn = rows.length ? R[rows[0].key].top10.since : null;
  el("p", { class: "note" }, s, "Since the rules went in: " + (podSince("b", POD_W) || "–") + " (" + (sn ? sn.nights : 0) + " night" +
     (sn && sn.nights === 1 ? "" : "s") + (sn && sn.nights < 3 ? "; a range needs 3+, so dots only" : "") + "). Season: every night each list ran.");
  var cols = el("div", { class: "pod-cols" }, s);

// ---- 1. finish distribution

// ---- the multiple, or points as the backup
function hasMult() { return D.contest_side.player_multiples; }

}
function tallyStr(t) { return t[0] + "-" + t[1] + "-" + t[2]; }
function sumTally(list) { return list.reduce(function (a, t) { return [a[0] + t[0], a[1] + t[1], a[2] + t[2]]; }, [0, 0, 0]); }

function etrAdp(s, key, label) {
  var ns = inRange(), items = [], run = [], tot = 0, tl = [];

    var side = r.b.mine_etr > r.b.mine_adp ? "E" : r.b.mine_adp > r.b.mine_etr ? "A" : r.b.mine_etr ? "=" : "";
    items.push({ label: short(n.date), value: r.v, mark: side, tip: [sgn(r.v, hasMult() ? 2 : 1) + (hasMult() ? " top-1% multiple" : " points a pair"),
      short(n.date) + ": " + r.b.pairs.length + " pair" + (r.b.pairs.length === 1 ? "" : "s") + ", ETR's side " + tallyStr(r.b.tally) + " (W-L-push)",
      "you sided with ETR on " + r.b.mine_etr + ", with ADP on " + r.b.mine_adp].concat(r.b.pairs.slice(0, 4).map(function (p) {
        return p.etr + " (ETR) vs " + p.adp + " (ADP): " + sgn(p.pts, 1) + " pts" + (p.mult != null ? ", " + sgn(p.mult) + "x" : ""); })) });
  });

  legend(s, [{ name: "ETR's side better", color: "var(--me)" }, { name: "ADP's side better", color: "var(--neg)" }, { name: "Zero: no difference", color: "var(--field)", line: true }]);

// ---- 2. T1
function t1() { var s = card("T1: ETR's order vs ADP's", D.defs.t1); etrAdp(s, "t1", "T1, afternoon"); }

// ---- 3. T2
function t2() {

  if (!D.contest_side.groups_by_night) wait(s, "per-night group multiples (elite-break teams)");
  else groupBars(s, [["Elite-break teams", "elite-break teams"], ["Other teams", "other teams"]].map(function (g) {
    return aggGroup(inRange(), g[0], function (n, w) { return n.t2.elite && n.t2.elite[w] ? n.t2.elite[w][g[1]] : null; }); }), "Elite-break teams");

  var names = [];

    per.forEach(function (n) { n.t2.turns.forEach(function (c) {

      mt += c.mine.teams; mo += c.mine.of; ft += c.field.teams; fo += c.field.of;
      if (c.vs_field_top1 != null) { w1 += c.vs_field_top1 * c.field.teams; w10 += (c.vs_field_top10 || 0) * c.field.teams; wt += c.field.teams; }
    }); });
    return { label: name, mine: mo ? mt / mo : null, field: fo ? ft / fo : null, top1: wt ? w1 / wt : null, top10: wt ? w10 / wt : null,

/** One group over the range: share of lineups (yours over your lineups in that window, the field's over all), top-1% and

function aggGroup(ns, label, get) {

  ns.forEach(function (n) { ["am", "pm"].forEach(function (w) {
    var b = get(n, w); if (!b || b.share == null) return;
    any = true;
    ft += b.teams; fb += b.share ? b.teams / b.share : 0;
    mt += b.mine ? b.mine.teams : 0; mb += n.header[w] || 0;

// ---- 4. T3 and T4: your moves vs the button
function moves(t) {

function t5() {
  var s = card("T5: drafted picks, round 6, swaps", D.defs.t5), ns = inRange();
  el("div", { class: "sub" }, s, "Drafted T5 picks: under 60%, at/over 60%, and T4 PRICEY dropped into T5: your share of lineups vs the field's, top-1% multiple, " + rangeLabel());
  var haveDrop = D.contest_side.groups_by_night && inRange().some(function (n) { return n.t5.groups && ["am", "pm"].some(function (w) { return n.t5.groups[w] && n.t5.groups[w].dropped; }); });
  if (!D.contest_side.groups_by_night) wait(s, "per-night T5 groups (under, at/over 60%, T4 PRICEY dropped into T5)");
  else {
    groupBars(s, [["Under 60% drafted", "under"], ["At/over 60% drafted", "over"], ["T4 PRICEY (dropped into T5)", "dropped"]].map(function (g) {
      return aggGroup(inRange(), g[0], function (n, w) { return n.t5.groups && n.t5.groups[w] ? n.t5.groups[w][g[1]] : null; }); }), "T5 groups");
    if (!haveDrop) wait(s, "the T4 PRICEY (dropped into T5) group, and the 60% groups without those players");
  }
  el("div", { class: "sub" }, s, "Your round-6 pick vs the field's average round-6 pick, points, per night");
  legend(s, [{ name: "Yours better", color: "var(--me)" }, { name: "Yours worse", color: "var(--neg)" }, { name: "Zero: the field's average", color: "var(--field)", line: true }]);
  var items = ns.map(function (n) {
    var r = n.t5.round6, v = r.mine != null && r.field != null ? r.mine - r.field : null;
    return { label: short(n.date), value: v, tip: [sgn(v, 1) + " points", short(n.date) + ": yours " + fmt(r.mine, 1) + " (" + r.mine_n + " lineups), field " + fmt(r.field, 1)] };
  });
  columns(s, items, { aria: "Round-6 points", dec: 1 });
  var m = ns.filter(function (n) { return n.t5.round6.mine != null; });
  var avg = m.length ? m.reduce(function (a, n) { return a + n.t5.round6.mine - n.t5.round6.field; }, 0) / m.length : null;
  el("p", { class: "note" }, s, "Average per night, " + rangeLabel() + ": " + sgn(avg, 1) + " points.");
  el("div", { class: "sub" }, s, "Swaps: your swap list vs what your PM list would have taken");
  var sw = [].concat.apply([], ns.map(function (n) { return n.t5.swaps.map(function (x) { return [n.date, x.underdog, x.swap_list, x.pm_list, fmt(x.pts_swap, 1), fmt(x.pts_pm, 1), x.differs ? sgn(x.pts_swap - x.pts_pm, 1) : "same"]; }); }));
  var diff = [].concat.apply([], ns.map(function (n) { return n.t5.swaps.filter(function (x) { return x.differs; }); }));
  if (!sw.length) el("p", { class: "note" }, s, "No swaps with a swap lock in " + rangeLabel() + ".");
  else {
    el("p", { class: "note" }, s, sw.length + " swap" + (sw.length === 1 ? "" : "s") + "; the lists differed on " + diff.length +
       (diff.length ? ", where the swap list's player scored " + sgn(diff.reduce(function (a, x) { return a + x.pts_swap - x.pts_pm; }, 0) / diff.length, 1) + " a swap" : "") + ".");
    table(s, ["Night", "Underdog swapped in", "Swap list", "PM list", "Swap pts", "PM pts", "Difference"], sw);
  }
}

function render() {
  document.querySelectorAll(".controls button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.range === RANGE)); });
  $("main").textContent = "";
  if (!D || !played().length) return;
  header(); podReplay(); finish(); t1(); t2(); t5(); moves(3); moves(4);   // the pair-based move lines last: secondary to the pod replay
}

var rz = null;
window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(render, 150); });
document.querySelectorAll(".controls button").forEach(function (b) {
  b.addEventListener("click", function () { RANGE = b.dataset.range; try { localStorage.setItem("nbaResultsRange", RANGE); } catch (e) { /* storage blocked */ } render(); });
});

fetch("analysis/nba/dashboard.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
  D = d;
  var p = played(), cs = d.contest_side;
  $("status").textContent = "Through " + (p.length ? p[p.length - 1].date : "–") + " · " + p.length + " nights played · built " + d.generated +
    " · contest side: " + (cs.player_multiples ? "multiples in" : "multiples pending (charts use points)");
  render();
}).catch(function (e) { $("status").textContent = "Couldn't load the results: " + e; });
</script>
</body>
</html>
