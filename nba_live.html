<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* The board's dark theme, trimmed to what this page draws. */
  :root {
    color-scheme: dark;
    --bg: #080b11;
    --surface: #12151c;
    --surface-2: #161a22;
    --input: #0d1017;
    --ink: #ffffff;
    --muted: #8b94a4;
    --line: #1c212c;
    --line-strong: #2a3140;
    --accent: #ffffff;
    --accent-ink: #080b11;
    --live: #4dc48d;
    --bad: #f08a7e;
    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .shell { max-width: 820px; margin: 0 auto; padding: 0 16px 64px; }

  .masthead { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: 14px; }
  .mast-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; margin: 0; white-space: nowrap; }
  .views { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; align-self: center; }
  .views a { font-size: 12.5px; font-weight: 600; padding: 5px 12px; color: var(--muted); text-decoration: none; }
  .views a[aria-current="page"] { background: var(--accent); color: var(--bg); }
  .views a:not([aria-current]):hover { color: var(--ink); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; padding-block: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .grow { flex: 1 1 200px; min-width: 160px; }
  .field-label { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #tail { font-family: var(--mono); font-size: 14px; color: var(--ink); background: var(--input); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 9px; width: 76px; height: 34px; }
  select { font-family: var(--sans); font-size: 14px; color: var(--ink); background: var(--input); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 9px; width: 100%; height: 34px; }
  button { font-family: var(--sans); font-size: 13.5px; font-weight: 500; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 7px 13px; height: 34px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .status { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-bottom: 10px; }
  .viewbar { display: flex; gap: 6px; padding: 4px 0 8px; }
  html.folded .viewbar { padding-top: 10px; }
  .status .bad { color: var(--bad); }
  .fold { font-size: 11px; height: 22px; padding: 0 8px; margin-right: 8px; vertical-align: middle; }
  html.folded .controls, html.folded .legend { display: none; }
  html.folded .status { padding-top: 10px; }

  .head, .row { display: grid; grid-template-columns: 44px 34px minmax(0, 1fr) 74px 64px; gap: 10px; align-items: center; padding: 3px 4px; line-height: 1.25; }
  .head { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-block: 8px; }
  .row { border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover, .row.open { background: var(--surface); }
  /* Ahead of his round: deeper green the closer to the round's best. */
  .row.good { background: rgba(46, 170, 104, var(--good)); }
  .row.rstart { border-top: 2px solid var(--line-strong); }
  .row.lead .name, .row.lead .fp { font-weight: 700; }
  .r { text-align: right; }
  .adp { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .expo { font-family: var(--mono); font-size: 11px; font-weight: 600; text-align: center; border-radius: 4px; padding: 2px 0; }
  .who { min-width: 0; }
  .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm { font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  /* A tapped player's full line, under his row across every column. */
  .detail { grid-column: 1 / -1; font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 2px 0 5px; line-height: 1.5; }
  .detail b { color: var(--ink); font-weight: 600; }
  .game { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }
  .game.in { color: var(--live); }
  .fp { font-family: var(--mono); font-size: 15px; font-weight: 600; text-align: right; }
  .fp.none { color: var(--muted); font-weight: 400; font-size: 13px; }
  .empty { color: var(--muted); padding: 24px 4px; }
  /* My lineups: chance, the six, points now, projected final */
  .lu { display: grid; grid-template-columns: 54px minmax(0, 1fr) 54px 54px; gap: 8px; align-items: center; padding: 7px 4px;
        border-bottom: 1px solid var(--line); cursor: pointer; }
  .lu.lhead { font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; cursor: default; }
  .lu .ch { font-family: var(--mono); font-size: 13px; font-weight: 700; text-align: center; border-radius: 4px; padding: 3px 0; }
  .lu .six { font-size: 12.5px; line-height: 1.35; }
  .lu .six span { white-space: nowrap; }
  .lu .six .done { color: var(--muted); }
  .lu .six .in { color: var(--live); }
  .lu .n { font-family: var(--mono); font-size: 13px; text-align: right; }
  .lu .sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .lsum { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 8px 4px; line-height: 1.5; }
  .lu.gold { background: rgba(212, 168, 40, 0.16); box-shadow: inset 3px 0 0 #d4a828; }
  .lu .chw { display: flex; flex-direction: column; gap: 3px; }
  .lu .t10 { font-family: var(--mono); font-size: 9.5px; font-weight: 700; text-align: center; border-radius: 4px; padding: 1px 0;
             background: #d4a828; color: #1a1400; }
  .lsum b { color: var(--ink); }
  /* No exposure loaded: the chip column goes. */
  .list.no-expo .head, .list.no-expo .row { grid-template-columns: 44px minmax(0, 1fr) 74px 64px; }
  .list.no-expo .expo, .list.no-expo .exph { display: none; }
  @media (max-width: 520px) {
    .head, .row { grid-template-columns: 32px 28px minmax(0, 1fr) 52px 42px; gap: 6px; }
    .list.no-expo .head, .list.no-expo .row { grid-template-columns: 32px minmax(0, 1fr) 52px 42px; }
    .name { font-size: 13px; }
    .fp { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="masthead">
    <div class="mast-row">
      <h1>Live</h1>
      <nav class="views" aria-label="Pages">
        <a href="/">Home</a>
        <a href="./">NFL</a>
        <a href="nba.html">NBA</a>
        <a href="cbb.html">CBB</a>
        <a href="nba_live.html" aria-current="page">Live</a>
        <a href="/survivor/">Survivor</a>
      </nav>
    </div>
    <div class="controls">
      <label class="field grow">
        <span class="field-label">Slate</span>
        <select id="slate"></select>
      </label>
      <label class="field">
        <span class="field-label">Sort</span>
        <select id="sort">
          <option value="adp">ADP</option>
          <option value="fp">UD points</option>
          <option value="expo">Exposure</option>
        </select>
      </label>
      <label class="field" title="From this ADP down, players sort by points instead of ADP (36 is where Underdog parks everyone undrafted)">
        <span class="field-label">Points from ADP</span>
        <input type="number" id="tail" step="0.1" min="1" max="36" inputmode="decimal">
      </label>
      <div class="field">
        <span class="field-label">Exposure</span>
        <span style="display:flex; gap:6px">
          <button type="button" id="mine" aria-pressed="false" hidden title="Only players in at least one of your drafts">Mine only</button>
          <button type="button" id="drafted" aria-pressed="true" hidden title="Only players the field drafted: in at least 1% of the biggest contest's pods">Drafted only</button>
          <button type="button" id="upload" title="Your Underdog exposure CSV for this slate">Upload</button>
        </span>
        <input type="file" id="file" accept=".csv,text/csv" hidden>
      </div>
      <label class="field" title="The Underdog username whose lineups My lineups shows: yours, as the leaderboard spells it. Kept on this device">
        <span class="field-label">Username</span>
        <input type="text" id="me" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:130px">
      </label>
      <div class="field">
        <span class="field-label">&nbsp;</span>
        <button type="button" id="refresh">Refresh</button>
      </div>
    </div>
    <div class="viewbar" id="viewField" hidden>
      <button type="button" id="vPlayers" aria-pressed="true">Players</button>
      <button type="button" id="vLineups" aria-pressed="false" title="Your lineups in the biggest contest: their chance to finish top 1%, gold when live for the top 10">My lineups</button>
    </div>
    <div class="status"><button type="button" id="fold" class="fold" aria-expanded="true" title="Hide or show the controls and the colour key">Hide</button><span id="status">Loading&hellip;</span><span id="legend" class="legend"></span></div>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
var MIRROR = "https://raw.githubusercontent.com/JonBoyBeats/br-adp-mirror/main/";
/* NBA and college basketball slates side by side in the Slate list; each slate's sport picks its ESPN
   feed, how its game clock reads (four 12-minute quarters, or two 20-minute halves) and its usual output. */
var ESPN = { nba: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba",
             cbb: "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball" };
var PERIODS = { nba: [4, 12], cbb: [2, 20] };      // periods in regulation, minutes each
/* Green rows: the best of each round so far. A draft is TEAMS players x ROUNDS rounds of a
   snake, so a player's round is his ADP rank in blocks of TEAMS, everyone past the fifth in
   the last. Who actually goes in a round loosens as the draft goes on: the top 7 or so in the
   first, 8 in the second, 9 in the third, 10 in the fourth and fifth, 12 in the sixth.
   POOLS are those groups, by ADP rank, and a player is set against his round's; everyone
   past the sixth's group (the undrafted pile) is held to the sixth round's bar, since a
   pool of all of them would set it by bench players (Oct 26: 27.9 usual points against
   35.7 for ranks 29-36, so any late pick having a normal night turned green). The green is
   on what he's scored: his points so far against what the group usually scores by this point
   of the game (its median usual output, from the nightly box-score file, times the share
   played), so a higher projection alone never turns a row green at the tip. To set players
   against each other, each one whose game has started is tracking his points so far plus
   the round's usual for the rest of his game; one whose game hasn't started is held at his
   own usual output, so early in the night the first games' players are measured against
   the projections of those still to play, and can't be green until they're on track to
   beat them. Each round's leader on that count is dark green (no one, while it's a player
   yet to start). The rest are light green only if they're also ahead of the round's usual so
   far, shaded by how far behind the leader they are, fading to nothing at CLOSE points by the
   final horn and that times the share played before it (2.5 after a quarter, 5 at the half):
   early on everyone's count is mostly the round's usual, so a fixed 10 caught the whole round.
   A leader more than that ahead of everyone is his round's only green. Past the sixth round's
   group (the undrafted pile, 40+ players) only a leader goes green. scripts/live_audit.js
   replays past nights through this code and holds it to that (run it after changing it).
   Pace (points so far plus his own usual output for the rest) is still shown in the
   tap-open line. */
var TEAMS = 6, ROUNDS = 6, CLOSE = 10;
var POOLS = [[1, 7], [6, 13], [12, 20], [17, 26], [23, 32], [29, 40]];   // ADP ranks, first and last
function roundOf(rank) { return Math.min(ROUNDS, Math.ceil(rank / TEAMS)); }
var EVERY = 60;   // seconds between pulls while the page is open; ESPN's box scores move about this often
// ESPN's abbreviations -> the board's (the nightly job's map)
var TEAM = { SA: "SAS", NY: "NYK", GS: "GSW", NO: "NOP", UTAH: "UTA", WSH: "WAS" };
// ESPN's spelling -> Underdog's, as on the board
var ESPN_ALIASES = { "miles mcbride": "deuce mcbride", "herbert jones": "herb jones", "moritz wagner": "moe wagner",
                     "luguentz dort": "lu dort", "cameron johnson": "cam johnson" };
var STAT = { MIN: "min", PTS: "pts", REB: "reb", AST: "ast", STL: "stl", BLK: "blk", TO: "tov",
             minutes: "min", points: "pts", rebounds: "reb", assists: "ast", steals: "stl", blocks: "blk", turnovers: "tov" };
// the rest of the box line, kept as ESPN writes it, for a tapped player
var EXTRA = { FG: "fg", "3PT": "fg3", FT: "ft",
              "fieldGoalsMade-fieldGoalsAttempted": "fg", "threePointFieldGoalsMade-threePointFieldGoalsAttempted": "fg3",
              "freeThrowsMade-freeThrowsAttempted": "ft" };

var state = { slates: [], slate: null, sort: load("brr:live:sort", "fp"), mine: false, open: {}, posted: {}, proj: {}, projBy: { nba: {}, cbb: {} }, cbbRows: {},
              games: {}, gamesById: {}, box: {}, finals: {}, pulledAt: null, error: null, busy: false,
              field: {}, fieldBusy: {}, draftedOnly: load("brr:live:drafted", true), view: load("brr:live:view", "players"), sim: null };
function sportOf(s) { return (s && s.sport) || "nba"; }

function $(id) { return document.getElementById(id); }
function load(key, fallback) { try { var v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
/** The ADP from which this slate's rows sort by points: yours if set, else the last pick. */
/* ---- The field: every lineup in the slate's biggest contest. Underdog's leaderboard is public once the contest
   locks, but its swaps (a player ruled out goes to the drafter's best undrafted one) happen at the first tip, so
   this waits until FIELD_AFTER minutes past the slate's first game, then reads every team once, 50 a page and a
   few pages at a time, and keeps them on this device. A player swapped off every team reads 0 drafted. */
var FIELD_AFTER = 15;   // minutes after the first tip
var ME = load("brr:live:me", "jonboybeats");   // whose lineups My lineups shows: the Username box, kept on this device
var UD = "https://api.underdogfantasy.com/v1/draft_pools/";
var UDQ = "product=fantasy&product_experience_id=c7ade3c1-71ae-4593-a7e1-07f63c7e94ae&state_config_id=725014ef-3570-4e93-871d-d69674ab3521";
var FIELD_MIN = 0.01;   // drafted in 1% of pods or more is "drafted"

function flagship(s) {
  return ((s && s.contests) || []).filter(function (c) { return /person drafts/.test(c.description || "") && !/Admin/.test(c.description); })
    .sort(function (a, b) { return (b.entry_count || 0) - (a.entry_count || 0); })[0] || null;
}

/** When the field can be read: FIELD_AFTER minutes past the slate's first tip (ESPN's start times), or past its
    lock plus the usual 8 minutes to the tip when the games aren't in yet. */
function fieldReadyAt(s) {
  var tips = Object.keys(state.games).map(function (t) { return new Date(state.games[t].date).getTime(); }).filter(isFinite);
  var first = tips.length ? Math.min.apply(null, tips) : new Date(s.cutoff).getTime() + 8 * 60e3;
  return first + FIELD_AFTER * 60e3;
}

async function loadField(s) {
  var c = flagship(s), ready = fieldReadyAt(s);
  if (!c || state.field[s.slate_id] || state.fieldBusy[c.id]) return;
  if (Date.now() < ready) { state.fieldWait = ready; return; }
  var kept = load("brr:live:field:" + c.id, null);
  if (kept && kept.users && new Date(kept.at).getTime() >= ready) { state.field[s.slate_id] = kept; render(); return; }
  state.fieldBusy[c.id] = true;
  try {
    var get = function (page) {
      return fetch(UD + c.id + "/leaderboard?page=" + page + "&" + UDQ).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status); return r.json();
      });
    };
    var first = await get(1), pages = Math.ceil(first.meta.count / 50), entries = first.draft_pool_entries.slice();
    for (var p = 2; p <= pages; p += 6) {
      var batch = [];
      for (var q = p; q < p + 6 && q <= pages; q++) batch.push(get(q));
      (await Promise.all(batch)).forEach(function (d) { entries = entries.concat(d.draft_pool_entries); });
    }
    var pods = {}, inPod = {}, apps = [], ix = {}, teams = [], users = [];
    entries.forEach(function (e, i) {
      pods[e.draft_id] = 1;
      e.appearance_ids.forEach(function (a) {
        (inPod[a] = inPod[a] || {})[e.draft_id] = 1;
        if (ix[a] == null) { ix[a] = apps.length; apps.push(a); }
        teams.push(ix[a]);
      });
      for (var k = e.appearance_ids.length; k < ROUNDS; k++) teams.push(-1);   // a short team keeps its six slots
      users.push((e.username || "").toLowerCase());
    });
    var n = Object.keys(pods).length, pct = {};
    Object.keys(inPod).forEach(function (a) { pct[a] = Object.keys(inPod[a]).length / n; });
    var f = { contest: c.id, title: (c.title || "").trim(), entries: entries.length, pods: n, at: new Date().toISOString(),
              pct: pct, apps: apps, teams: teams, users: users };
    state.field[s.slate_id] = f;
    // one field kept at a time: a night's lineups are a few hundred KB
    try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("brr:live:field:") === 0) localStorage.removeItem(k); }); } catch (e) {}
    save("brr:live:field:" + c.id, f);
  } catch (e) {
    state.fieldError = e.message;
  } finally {
    state.fieldBusy[c.id] = false;
  }
  render();
}

function tailFor(slate) { return (slate && load("brr:live:tail:" + slate.slate_id, null)) || TEAMS * ROUNDS; }
function expoKey(label) { return "brr:expo:" + label; }   // the board's key, so an upload on either page shows on both

function normName(s) {
  return String(s == null ? "" : s).toLowerCase()
    .replace(/[‘’'`.]/g, "").replace(/[-‐-―]/g, " ")
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, " ").replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ").trim();
}
function udPoints(s) { return Math.round((s.pts + 1.2 * s.reb + 1.5 * s.ast + 3 * (s.stl + s.blk) - s.tov) * 10) / 10; }
function pt(d, opts) { return d.toLocaleString("en-US", Object.assign({ timeZone: "America/Los_Angeles" }, opts)); }

/** The ET calendar day of the slate, which is the day ESPN files its games under. */
function espnDate(iso) {
  var p = new Date(iso).toLocaleDateString("en-CA", { timeZone: "America/New_York" });   // YYYY-MM-DD
  return p.replace(/-/g, "");
}

// ---------------------------------------------------------------- slates
async function mirror(file) {
  var r = await fetch(MIRROR + file + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(file + ": HTTP " + r.status);
  return r.json();
}

/** Tonight's slates, NBA and college: locked ones from <sport>_tonight.json, open ones from <sport>_latest.json. */
async function loadSlates() {
  var got = await Promise.all(["nba_latest.json", "nba_tonight.json", "cbb_latest.json", "cbb_tonight.json"].map(function (f) {
    return mirror(f).catch(function () { return { slates: [] }; });
  }));
  var seen = {}, now = Date.now(), out = [];
  got.reduce(function (all, g) { return all.concat(g.slates || []); }, []).forEach(function (s) {
    var t = new Date(s.cutoff).getTime();
    if (seen[s.slate_id] || !s.players.length || t < now - 20 * 3600e3 || t > now + 16 * 3600e3) return;
    seen[s.slate_id] = 1;
    out.push(s);
  });
  return out.sort(function (a, b) { return a.cutoff < b.cutoff ? -1 : 1; });
}

function fillSlates() {
  var sel = $("slate"), keep = load("brr:live:slate", null), now = Date.now(), pick = 0;
  sel.innerHTML = "";
  state.slates.forEach(function (s, i) {
    var o = document.createElement("option");
    var locked = new Date(s.cutoff).getTime() <= now;
    o.value = String(i);
    o.textContent = sportOf(s).toUpperCase() + " · " + (s.title || s.label).replace(/ Slate$/, "") + " · " + (locked ? "locked " : "locks ") + pt(new Date(s.cutoff), { hour: "numeric", minute: "2-digit" }) + " PT";
    sel.appendChild(o);
  });
  /* Of the slates being played (locked), the one with your exposures (uploaded here or posted to
     expo.json), else the main slate: a late slate's games are all on the main slate too. */
  var mine = function (s) { var e = load(expoKey(s.label), null); return !!((e && e.drafts) || state.posted[s.slate_id]); };
  var played = state.slates.filter(function (s) { return new Date(s.cutoff).getTime() <= now; });
  var choose = played.filter(mine).pop() || played.filter(function (s) { return /_main$/.test(s.label); }).pop() || played.pop();
  if (choose) pick = state.slates.indexOf(choose);
  state.slates.forEach(function (s, i) { if (s.label === keep) pick = i; });
  sel.value = String(pick);
  setSlate(state.slates[pick] || null);
}

/** Make a slate the one shown: its sport's usual output is what grade() reads. */
function setSlate(s) {
  state.slate = s;
  state.proj = state.projBy[sportOf(s)] || {};
}

// ---------------------------------------------------------------- ESPN
/** One ESPN call, tried again once after a short wait: on a big slate a minute's pull is a dozen
    calls, and one of them now and then comes back an error or not at all. */
async function espn(path) {
  for (var tries = 0; ; tries++) {
    try {
      var r = await fetch(ESPN[sportOf(state.slate)] + path, { cache: "no-store" });
      if (!r.ok) throw new Error("ESPN " + r.status);
      return await r.json();
    } catch (err) {
      if (tries >= 1) throw err;
      await new Promise(function (ok) { setTimeout(ok, 1500); });
    }
  }
}

function gameLabel(e, sport) {
  var st = e.status || {}, ty = st.type || {}, n = PERIODS[sport || "nba"][0];
  if (ty.state === "pre") return pt(new Date(e.date), { hour: "numeric", minute: "2-digit" });
  if (ty.state === "post") return "Final";
  if (ty.name === "STATUS_HALFTIME") return "Half";
  var q = st.period > n ? "OT" + (st.period > n + 1 ? st.period - n : "") : (n === 2 ? "H" : "Q") + st.period;
  if (ty.name === "STATUS_END_PERIOD" || st.displayClock === "0.0") return "End " + q;
  return q + " " + st.displayClock;
}

function boxRows(summ) {
  var out = [];
  ((summ.boxscore || {}).players || []).forEach(function (t) {
    var team = (sportOf(state.slate) === "nba" && TEAM[t.team.abbreviation]) || t.team.abbreviation, st = (t.statistics || [])[0] || {};
    var keys = st.keys || st.labels || st.names || [];
    (st.athletes || []).forEach(function (a) {
      var s = { pts: 0, reb: 0, ast: 0, stl: 0, blk: 0, tov: 0, min: 0 };
      var x = {};
      (a.stats || []).forEach(function (v, i) {
        var k = STAT[keys[i]], e = EXTRA[keys[i]];
        if (k) s[k] = parseFloat(String(v).split("-")[0]) || 0;
        if (e) x[e] = String(v);
      });
      var nm = normName(a.athlete.displayName);
      out.push({ key: ESPN_ALIASES[nm] || nm, id: String(a.athlete.id), team: team, s: s, x: x, out: !!a.didNotPlay, has: (a.stats || []).length > 0 });
    });
  });
  return out;
}

/** College: this slate's games, by ESPN game id and by opponent, from our projection file. */
function slateEvents() {
  var out = {};
  state.slate.players.forEach(function (p) {
    var r = state.cbbRows[p.player_id];
    if (r && r.event) out[r.event] = 1;
    if (r && r.opp) out[r.opp] = 1;
  });
  return out;
}

/** One pull: the day's scoreboard, then a box score for every game under way or newly final. */
async function pull() {
  if (!state.slate || state.busy) return;
  loadField(state.slate);                 // once its contest has locked; a no-op after that
  state.busy = true;
  try {
    var day = espnDate(state.slate.cutoff), sport = sportOf(state.slate);
    // college: every D1 game (ESPN lists only featured ones otherwise), box scores only for the slate's games
    var board = await espn("/scoreboard?dates=" + day + (sport === "cbb" ? "&groups=50&limit=500" : "&limit=50"));
    var games = {}, byId = {}, todo = [], mine = sport === "cbb" ? slateEvents() : null;
    (board.events || []).forEach(function (e) {
      var g = { id: e.id, state: e.status.type.state, label: gameLabel(e, sport), date: e.date, away: null, home: null,
                period: e.status.period, clock: e.status.displayClock,
                status: e.status.type.name, periods: PERIODS[sport][0], len: PERIODS[sport][1] };
      ((e.competitions || [])[0] || {}).competitors.forEach(function (c) {
        var t = (sport === "nba" && TEAM[c.team.abbreviation]) || c.team.abbreviation;
        g[c.homeAway === "home" ? "home" : "away"] = t;
        games[t] = g;
      });
      byId[e.id] = g;
      if (g.state !== "pre" && !state.finals[e.id] && (!mine || mine[e.id] || mine[g.home] || mine[g.away])) todo.push(g);
    });
    // a game whose box score still doesn't come keeps its last one; the rest update
    var got = await Promise.allSettled(todo.map(async function (g) {
      state.box[g.id] = boxRows(await espn("/summary?event=" + g.id));
      if (g.state === "post") state.finals[g.id] = true;     // a final box score doesn't change; stop asking
    }));
    state.missed = got.filter(function (x) { return x.status === "rejected"; }).length;
    state.games = games;
    state.gamesById = byId;
    state.pulledAt = new Date();
    state.error = null;
  } catch (err) {
    state.error = err;
  } finally {
    state.busy = false;
  }
  render();
}

// ---------------------------------------------------------------- exposure (the board's parser)
function parseCsv(text) {
  var rows = [], row = [], field = "", q = false, i = 0, d = String(text).split(/\r?\n/)[0].indexOf("\t") >= 0 ? "\t" : ",";
  text = String(text).replace(/^﻿/, "");
  while (i < text.length) {
    var c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } q = false; i++; continue; } field += c; i++; continue; }
    if (c === '"') { q = true; i++; continue; }
    if (c === d) { row.push(field); field = ""; i++; continue; }
    if (c === "\r") { i++; continue; }
    if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += c; i++;
  }
  row.push(field); rows.push(row);
  return rows.filter(function (r) { return r.length > 1 || (r[0] || "").trim() !== ""; });
}

function ingestExposure(text, fileName) {
  var rows = parseCsv(text), h = rows[0].map(function (c) { return String(c).trim().toLowerCase(); });
  var iApp = h.indexOf("appearance"), iDraft = h.indexOf("draft"), iF = h.indexOf("first name"), iL = h.indexOf("last name");
  if (iApp < 0 || iDraft < 0) { setStatus(fileName + " isn't an Underdog exposure export (no Appearance and Draft columns).", true); return; }
  var drafts = {}, byApp = {}, byName = {}, seen = {};
  rows.slice(1).forEach(function (r) {
    if (r.length < h.length / 2 || !r[iDraft]) return;
    var dft = r[iDraft], app = r[iApp], nm = normName((r[iF] || "") + " " + (r[iL] || ""));
    drafts[dft] = 1;
    if (seen[dft + "|" + app]) return;
    seen[dft + "|" + app] = 1;
    byApp[app] = (byApp[app] || 0) + 1;
    byName[nm] = (byName[nm] || 0) + 1;
  });
  var n = Object.keys(drafts).length, best = state.slate, bestHits = 0;
  if (!n) { setStatus(fileName + ": no drafts in this file.", true); return; }
  state.slates.forEach(function (sl) {
    var hits = sl.players.filter(function (p) { return byApp[p.appearance_id]; }).length;
    if (hits > bestHits) { best = sl; bestHits = hits; }
  });
  var counts = {};
  best.players.forEach(function (p) {
    var c = byApp[p.appearance_id] || byName[normName(p.first_name + " " + p.last_name)] || 0;
    if (c) counts[p.player_id] = c;
  });
  save(expoKey(best.label), { file: fileName, at: new Date().toISOString(), drafts: n, counts: counts });
  if (best !== state.slate) { state.slate = best; $("slate").value = String(state.slates.indexOf(best)); }
  render();
}

/** The board's chip colour: red at 1 in 12 or less, white at 1 in 6, dark green at 2 in 6 or more. */
function expoColor(f) {
  function mix(a, b, t) { return a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }); }
  var white = [255, 255, 255], green = [26, 92, 52], red = [198, 40, 40];
  var c = f >= 1 / 6 ? mix(white, green, Math.min(1, (f - 1 / 6) * 6)) : mix(white, red, Math.min(1, (1 / 6 - f) * 12));
  var lum = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
  return { bg: "rgb(" + c.join(",") + ")", ink: lum < 140 ? "#ffffff" : "#111111" };
}

// ---------------------------------------------------------------- drawing
function setStatus(msg, bad, legend) {
  var el = $("status"); el.textContent = msg; el.classList.toggle("bad", !!bad);
  $("legend").textContent = legend || "";
}
function setFolded(on) {
  document.documentElement.classList.toggle("folded", on);
  $("fold").textContent = on ? "Show" : "Hide";
  $("fold").setAttribute("aria-expanded", String(!on));
  save("brr:live:folded", on);
}

/** How much of the game is played, 0 to 1; overtime counts as done. */
function played(g) {
  if (!g || g.state === "pre") return 0;
  var n = g.periods || 4, len = g.len || 12;        // NBA's four 12-minute quarters unless the game says otherwise
  if (g.state === "post" || g.period > n) return 1;
  // at a break the clock can already read the next period's start: go by the status
  if (g.status === "STATUS_HALFTIME") return 0.5;
  if (g.status === "STATUS_END_PERIOD") return Math.min(1, g.period / n);
  var c = String(g.clock || "0").split(":"), left = c.length > 1 ? +c[0] + c[1] / 60 : c[0] / 60;
  return Math.min(1, ((g.period - 1) * len + len - (left || 0)) / (n * len));
}

/** Each row's pace, and how far it runs over the median pace of the players drafted around him. */
function grade(rows) {
  var byAdp = rows.slice().sort(function (a, b) { return a.p.adp - b.p.adp; });
  byAdp.forEach(function (r) {
    var f = played(r.g), proj = state.proj[normName(r.p.first_name + " " + r.p.last_name)];
    r.played = f;
    if (r.b && r.b.out) r.pace = 0;
    else if (proj == null) r.pace = f >= 0.25 ? (r.fp || 0) / f : null;   // no usual output to lean on
    else r.pace = (r.fp || 0) + (1 - f) * proj;
  });
  byAdp.forEach(function (r, i) { r.round = roundOf(i + 1); });
  for (var rd = 1; rd <= ROUNDS; rd++) {
    var idx = [];
    byAdp.forEach(function (r, i) { if (r.round === rd) idx.push(i); });
    if (!idx.length) continue;
    var pool = byAdp.slice(POOLS[rd - 1][0] - 1, POOLS[rd - 1][1]);
    function mid(v) { v = v.filter(function (x) { return x != null; }).sort(function (a, b) { return a - b; });
                      return v.length ? (v[(v.length - 1) >> 1] + v[v.length >> 1]) / 2 : null; }
    var med = mid(pool.map(function (r) { return r.pace; })), best = Math.max.apply(null, pool.map(function (r) { return r.pace || 0; }));
    var usual = mid(pool.map(function (r) { return state.proj[normName(r.p.first_name + " " + r.p.last_name)]; }));
    function ahead(r) { return usual != null && r.played > 0 && r.fp != null && !(r.b && r.b.out) ? r.fp - r.played * usual : null; }
    function track(r) {
      if (r.b && r.b.out) return null;
      var a = ahead(r);
      if (a != null) return a + usual;                       // started: points so far + the round's usual for the rest
      return r.played > 0 ? null : state.proj[normName(r.p.first_name + " " + r.p.last_name)];   // not started: his usual
    }
    var lead = null;
    idx.forEach(function (i) {
      var r = byAdp[i], t = track(r);
      r.track = t;
      if (t != null && (lead == null || t > lead.track)) lead = r;
    });
    idx.forEach(function (i) {
      var r = byAdp[i], a = ahead(r), gap = lead ? lead.track - r.track : null;
      r.med = med; r.best = best; r.ahead = a; r.usualNow = usual == null ? null : r.played * usual;
      r.lead = lead; r.gap = gap;
      // only a started player turns green; light green only ahead of the round's usual, near the leader for this point of his game
      var w = CLOSE * r.played;
      r.good = a == null ? 0 : gap <= 0 ? 1 : a > 0 && gap < w && i < POOLS[ROUNDS - 1][1] ? 1 - gap / w : 0;
    });
  }
}

/** A tapped player's box line in two lines (before he plays, his game instead), then his pace. */
function detailHtml(r) {
  function esc(v) { return String(v).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
  var g = r.g, p = r.p, bits = [];
  var game = g ? (g.away + " at " + g.home + " · " + (g.state === "pre" ? "tips " + pt(new Date(g.date), { hour: "numeric", minute: "2-digit" }) + " PT" : g.label)) : "No game found for " + (p.team || "his team");
  if (p.injury) game += " · listed " + p.injury;
  if (r.fp != null) {
    var s = r.b.s, x = r.b.x;
    bits.push("<b>" + s.pts + " pts</b>" + (x.fg ? " · " + esc(x.fg) + " FG" : "") + (x.fg3 ? " · " + esc(x.fg3) + " 3PT" : "") +
              (x.ft ? " · " + esc(x.ft) + " FT" : "") + " · " + s.min + " min");
    bits.push("<b>" + s.reb + " reb</b> · <b>" + s.ast + " ast</b> · " +
              s.stl + " stl · " + s.blk + " blk · " + s.tov + " TO");
  } else {
    bits.push(esc(game));
    if (g && g.state !== "pre") bits.push((r.b && r.b.out) || g.state === "post" ? "Did not play" : "No box score line for him yet");
  }
  if (r.pace != null && !(r.b && r.b.out)) {
    var sign = function (v) { return (v > 0 ? "+" : v < 0 ? "\u2212" : "\u00b1") + Math.abs(v).toFixed(1); };
    bits.push((r.played >= 1 ? "Finished with " : r.played > 0 ? "On pace for " : "Usually ") + "<b>" + Math.round(r.pace) + "</b>" +
              (r.ahead != null ? " · round " + r.round + " usually has " + r.usualNow.toFixed(1) + " by now (" + sign(r.ahead) + ")" : ""));
  }
  return bits.join("<br>");
}

/* ---- My lineups: how live each is for the top 1%. Every lineup in the field is points so far plus what its players
   have left: his usual for the minutes still to play (none if he's out or done), with a spread of K x the square
   root of his usual x the square root of the game left. The rest of the night is drawn SIMS times, the same draw
   for a player on every lineup, so lineups sharing players rise and fall together; each draw ranks the whole field.
   Chance = the share of draws a lineup lands in the top 1%. K is spreadK(): replayed on 14 past flagships
   (scripts/nba_live_calibration.py) the chances were right with K 3.0 until a quarter in and 2.0 from the half;
   before the tip they still run high for the best lineups, so read them from the first quarter on. ETR's median as
   his usual (today's file uploaded on the board in this browser) made better chances than the morning's. */
function spreadK(f) { return f <= 0.25 ? 3.0 : f >= 0.5 ? 2.0 : 3.0 - 4 * (f - 0.25); }
var SIMS = 400;

function normal() { var u = 1 - Math.random(), v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function simulate(fld, rowsByApp, mineIdx) {
  var np = fld.apps.length, now = new Float64Array(np), mean = new Float64Array(np), sd = new Float64Array(np), left = [];
  fld.apps.forEach(function (a, i) {
    var r = rowsByApp[a];
    if (!r) return;
    var f = played(r.g), out = r.b && r.b.out, proj = state.proj[normName(r.p.first_name + " " + r.p.last_name)] || 0;
    now[i] = r.fp || 0;
    if (out || f >= 1) return;
    mean[i] = (1 - f) * proj;
    sd[i] = spreadK(f) * Math.sqrt(proj) * Math.sqrt(1 - f);
    left[i] = true;
  });
  var nt = fld.teams.length / ROUNDS, cut1 = Math.ceil(nt / 100), tot = new Float64Array(nt), draw = new Float64Array(np);
  var top1 = new Float64Array(mineIdx.length), top10 = new Float64Array(mineIdx.length), win = new Float64Array(mineIdx.length), cuts = [];
  for (var s = 0; s < SIMS; s++) {
    for (var i = 0; i < np; i++) draw[i] = now[i] + (left[i] ? Math.max(-now[i], mean[i] + sd[i] * normal()) : 0);
    for (var t = 0; t < nt; t++) {
      var x = 0;
      for (var k = 0; k < ROUNDS; k++) { var j = fld.teams[t * ROUNDS + k]; if (j >= 0) x += draw[j]; }
      tot[t] = x;
    }
    var sorted = tot.slice().sort(), line = sorted[nt - cut1], tenth = sorted[Math.max(0, nt - 10)], best = sorted[nt - 1];
    cuts.push(line);
    mineIdx.forEach(function (t, m) { if (tot[t] >= line) top1[m]++; if (tot[t] >= tenth) top10[m]++; if (tot[t] >= best) win[m]++; });
  }
  var expect = new Float64Array(nt);                  // each lineup's expected final, for the table
  for (var t2 = 0; t2 < nt; t2++) {
    var e = 0, n0 = 0;
    for (var k2 = 0; k2 < ROUNDS; k2++) { var j2 = fld.teams[t2 * ROUNDS + k2]; if (j2 >= 0) { e += now[j2] + mean[j2]; n0 += now[j2]; } }
    expect[t2] = e; tot[t2] = n0;
  }
  cuts.sort(function (a, b) { return a - b; });
  return { mine: mineIdx.map(function (t, m) {
             return { t: t, top1: top1[m] / SIMS, top10: top10[m] / SIMS, win: win[m] / SIMS, now: tot[t], proj: expect[t] };
           }).sort(function (a, b) { return b.top1 - a.top1 || b.top10 - a.top10 || b.proj - a.proj; }),
           line: cuts[cuts.length >> 1], nt: nt };
}

function chanceColor(p) {
  if (p >= 0.25) return { bg: "#1f8f55", ink: "#fff" };
  if (p >= 0.10) return { bg: "#3fae72", ink: "#fff" };
  if (p >= 0.03) return { bg: "#9ad5b0", ink: "#0b1f14" };
  if (p > 0) return { bg: "#2a3340", ink: "var(--ink)" };
  return { bg: "transparent", ink: "var(--muted)" };
}

var TOP10_GOLD = 0.02;   // live for the top 10: in it in 2% of draws or more

function renderLineups(fld, rowsByApp) {
  var host = $("list"), mineIdx = [];
  fld.users.forEach(function (u, i) { if (u === ME) mineIdx.push(i); });
  if (!ME) { host.innerHTML = '<div class="empty">Put your Underdog username in the Username box (Hide shows the controls).</div>'; return; }
  if (!mineIdx.length) { host.innerHTML = '<div class="empty">None of the ' + fld.entries.toLocaleString() + " lineups in " + fld.title + " is under " + ME + ".</div>"; return; }
  var key = fld.contest + "|" + ME + "|" + (state.pulledAt || 0);
  if (!state.sim || state.sim.key !== key) state.sim = { key: key, r: simulate(fld, rowsByApp, mineIdx) };
  var r = state.sim.r, expTop = r.mine.reduce(function (a, x) { return a + x.top1; }, 0);
  var gold = r.mine.filter(function (x) { return x.top10 >= TOP10_GOLD; }).length;
  host.insertAdjacentHTML("beforeend", '<div class="lsum">' + fld.title + ": <b>" + r.mine.length + "</b> of " + ME + "'s lineups in " + r.nt.toLocaleString() +
    ". Projected top-1% line <b>" + r.line.toFixed(1) + "</b>. Expected top-1% finishes <b>" + expTop.toFixed(1) + "</b> (" +
    (100 * expTop / r.mine.length).toFixed(1) + "% of yours, against 1% for a random lineup)." +
    (gold ? " <b>" + gold + "</b> live for the top 10 (gold)." : "") + "</div>");
  host.insertAdjacentHTML("beforeend", '<div class="lu lhead"><span>Top 1%</span><span>Lineup</span><span class="n">Now</span><span class="n">Proj</span></div>');
  r.mine.forEach(function (m) {
    var el = document.createElement("div"); el.className = "lu" + (m.top10 >= TOP10_GOLD ? " gold" : "");
    var c = chanceColor(m.top1), ch = document.createElement("span");
    ch.className = "ch"; ch.style.background = c.bg; ch.style.color = c.ink;
    ch.textContent = m.top1 >= 0.995 ? "99+" : m.top1 > 0 && m.top1 < 0.01 ? "<1" : String(Math.round(m.top1 * 100));
    ch.title = Math.round(m.top1 * 100) + "% of " + SIMS + " runs of the rest of the night in the top 1%; top 10 in " +
               (100 * m.top10).toFixed(1) + "%" + (m.win ? "; won " + (100 * m.win).toFixed(1) + "%" : "");
    var cw = document.createElement("span"); cw.className = "chw";
    cw.appendChild(ch);
    if (m.top10 >= TOP10_GOLD) {
      var t10 = document.createElement("span"); t10.className = "t10";
      t10.textContent = "T10 " + Math.round(m.top10 * 100) + "%";
      cw.appendChild(t10);
    }
    var six = document.createElement("div"); six.className = "six";
    var parts = [];
    for (var k = 0; k < ROUNDS; k++) {
      var j = fld.teams[m.t * ROUNDS + k];
      if (j < 0) continue;
      var pr = rowsByApp[fld.apps[j]], f = pr ? played(pr.g) : 0;
      parts.push('<span class="' + (pr && pr.b && pr.b.out ? "done" : f >= 1 ? "done" : f > 0 ? "in" : "") + '">' +
                 (pr ? pr.p.last_name : "?") + (pr && pr.fp != null ? " " + pr.fp.toFixed(0) : "") + "</span>");
    }
    six.innerHTML = parts.join(" · ");
    var nw = document.createElement("span"); nw.className = "n"; nw.textContent = m.now.toFixed(1);
    var pj = document.createElement("span"); pj.className = "n"; pj.textContent = m.proj.toFixed(1);
    el.append(cw, six, nw, pj);
    host.appendChild(el);
  });
}

function render() {
  var sl = state.slate, host = $("list");
  host.innerHTML = "";
  if (!sl) { host.innerHTML = '<div class="empty">No NBA or college slate tonight in the mirror.</div>'; setStatus(""); return; }
  /* Exposure: a CSV uploaded on this device, or the app's numbers posted to
     analysis/nba/expo.json for this slate, whichever is newer. */
  var ex = load(expoKey(sl.label), null), post = state.posted[sl.slate_id] || null, share = null, of = 0;
  if (ex && !ex.drafts) ex = null;
  if (post && (!ex || post.at > ex.at)) {
    var pct = {};
    // the app rounds down, so a player on the list at 0% is still in a draft
    Object.keys(post.pct).forEach(function (k) { pct[normName(k)] = Math.max(post.pct[k] / 100, 1 / post.teams); });
    share = function (p) { return pct[normName(p.first_name + " " + p.last_name)] || 0; };
    of = post.teams; ex = post;
  } else if (ex) {
    share = function (p) { return (ex.counts[p.player_id] || 0) / ex.drafts; };
    of = ex.drafts;
  }
  host.classList.toggle("no-expo", !ex);
  // Exposure sort needs exposures; without them it falls back to ADP (the choice is kept for the next slate)
  var sortBy = state.sort === "expo" && !ex ? "adp" : state.sort;
  $("sort").querySelector('option[value="expo"]').disabled = !ex;
  $("sort").value = sortBy;
  $("mine").hidden = !ex;
  $("mine").setAttribute("aria-pressed", String(!!(ex && state.mine)));

  // ESPN rows by name and team, then by name alone when only one player carries it
  // college: by ESPN's athlete and game ids from our projection file, since the two sites' team codes differ
  var byKey = {}, byName = {}, byId = {}, cbb = sportOf(sl) === "cbb";
  Object.keys(state.box).forEach(function (gid) {
    state.box[gid].forEach(function (b) {
      b.gid = gid;
      byKey[b.key + "|" + b.team] = b;
      byName[b.key] = byName[b.key] === undefined ? b : null;
      byId[b.id] = b;
    });
  });
  var rows = sl.players.map(function (p) {
    var k = normName(p.first_name + " " + p.last_name), cr = cbb ? state.cbbRows[p.player_id] || {} : null;
    var b = (cr && cr.espn && byId[String(cr.espn)]) || byKey[k + "|" + p.team] || byName[k] || null;
    var g = cr ? state.gamesById[cr.event] || state.games[cr.opp] || null : state.games[p.team] || null;
    // Points once he has a box line: in a live game even before his first full minute (ESPN
    // counts whole minutes, so everyone reads 0 at the tip); in a final one only if he played.
    var fp = b && !b.out && b.has && (b.s.min > 0 || (g && g.state === "in")) ? udPoints(b.s) : null;
    return { p: p, b: b, g: g, fp: fp, f: share ? share(p) : 0 };
  });
  // the field's picks: only players it drafted, before grading, so each round is judged against who was taken
  var fld = state.field[sl.slate_id] || null, rowsByApp = {};
  rows.forEach(function (r) { if (r.p.appearance_id) rowsByApp[r.p.appearance_id] = r; });
  $("viewField").hidden = !(fld && fld.users);
  var lineups = !!(fld && fld.users) && state.view === "lineups";
  $("vPlayers").setAttribute("aria-pressed", String(!lineups));
  $("vLineups").setAttribute("aria-pressed", String(lineups));
  $("drafted").hidden = !fld;
  $("drafted").setAttribute("aria-pressed", String(!!(fld && state.draftedOnly)));
  rows.forEach(function (r) { r.own = fld ? fld.pct[r.p.appearance_id] || 0 : null; });
  if (fld && state.draftedOnly) rows = rows.filter(function (r) { return r.own >= FIELD_MIN; });
  grade(rows);
  if (ex && state.mine) rows = rows.filter(function (r) { return r.f; });
  /* By ADP up to the last pick of the draft. Underdog parks everyone nobody is drafting at
     exactly that ADP (36.0), so from it on there's no order to keep: they sort by points.
     You can start that earlier per slate (Points from ADP). */
  var last = tailFor(state.slate);
  if (document.activeElement !== $("tail")) $("tail").value = last;
  function byFp(a, b) { return (b.fp == null ? -1 : b.fp) - (a.fp == null ? -1 : a.fp) || a.p.adp - b.p.adp; }
  function byExpo(a, b) { return b.f - a.f || a.p.adp - b.p.adp; }
  rows.sort(sortBy === "fp" ? byFp : sortBy === "expo" ? byExpo : function (a, b) {
    var ta = a.p.adp >= last, tb = b.p.adp >= last;
    return ta !== tb ? (ta ? 1 : -1) : ta ? byFp(a, b) : a.p.adp - b.p.adp;
  });

  if (lineups) {
    renderLineups(fld, rowsByApp);
  } else {
  var head = document.createElement("div");
  head.className = "head";
  head.innerHTML = '<span class="r">ADP</span><span class="exph">Exp</span><span>Player</span><span class="r">Game</span><span class="r" title="Underdog fantasy points">Pts</span>';
  host.appendChild(head);
  var prevRound = null;
  rows.forEach(function (r) {
    var p = r.p, el = document.createElement("div");
    el.className = "row";
    if (sortBy === "adp" && prevRound != null && r.round !== prevRound) el.classList.add("rstart");
    prevRound = r.round;
    if (r.good) {
      el.classList.add("good");
      if (r.good === 1) el.classList.add("lead");
      el.style.setProperty("--good", (0.10 + 0.55 * r.good).toFixed(2));
      el.title = r.fp.toFixed(1) + " so far, tracking " + r.track.toFixed(1) + (r.gap > 0
        ? ", " + r.gap.toFixed(1) + " behind his round's best: " + r.lead.p.last_name + " (" + r.lead.track.toFixed(1) +
          (r.lead.played > 0 ? ")" : ", his usual: not started)")
        : ", his round's best");
    }
    var adp = document.createElement("span"); adp.className = "adp r"; adp.textContent = p.adp.toFixed(1); el.appendChild(adp);
    var chip = document.createElement("span"); chip.className = "expo";
    if (ex) {
      var c = expoColor(r.f);
      chip.textContent = String(Math.round(r.f * 100));
      chip.style.background = c.bg; chip.style.color = c.ink;
      chip.title = Math.round(r.f * 100) + "% of your " + of + " teams";
    }
    el.appendChild(chip);
    var who = document.createElement("div"); who.className = "who";
    var nm = document.createElement("div"); nm.className = "name";
    nm.appendChild(document.createTextNode(p.first_name + " " + p.last_name));
    var tm = document.createElement("span"); tm.className = "tm"; tm.textContent = p.team || "";
    nm.appendChild(tm);
    if (r.own != null && r.own < 0.995) {
      var dr = document.createElement("span"); dr.className = "tm";
      dr.textContent = Math.round(r.own * 100) + "%";
      dr.title = "In " + Math.round(r.own * 100) + "% of the " + fld.pods.toLocaleString() + " pods of " + fld.title;
      nm.appendChild(dr);
    }
    who.appendChild(nm); el.appendChild(who);
    var game = document.createElement("span"); game.className = "game" + (r.g && r.g.state === "in" ? " in" : "");
    game.textContent = r.g ? r.g.label : "–";
    el.appendChild(game);
    var fp = document.createElement("span");
    // DNP only when ESPN says so, or his game is over without a minute from him.
    var dnp = r.g && r.g.state !== "pre" && ((r.b && r.b.out) || (r.g.state === "post" && state.box[r.g.id] && (!r.b || !r.b.s.min)));
    fp.className = "fp" + (r.fp == null ? " none" : "");
    fp.textContent = r.fp != null ? r.fp.toFixed(1) : dnp ? "DNP" : "–";
    el.appendChild(fp);
    if (state.open[p.player_id]) {
      el.classList.add("open");
      var d = document.createElement("div"); d.className = "detail"; d.innerHTML = detailHtml(r);
      el.appendChild(d);
    }
    el.addEventListener("click", function () { state.open[p.player_id] = !state.open[p.player_id]; render(); });
    host.appendChild(el);
  });
  if (!rows.length) host.insertAdjacentHTML("beforeend", '<div class="empty">None of your drafted players are on this slate.</div>');
  }

  var live = Object.keys(state.games).some(function (t) { return state.games[t].state === "in"; });
  var msg = state.pulledAt ? "Updated " + pt(state.pulledAt, { hour: "numeric", minute: "2-digit", second: "2-digit" }) + " PT" : "Fetching ESPN…";
  var legend = state.pulledAt ? (live ? " · refreshes every " + EVERY + "s while open" : "") +
    " · dark green: his round's leader so far (players yet to start count at their usual" +
    (state.projFrom ? ", ETR's median from today's file" : "") + "); light green: ahead of his round's usual and close behind, within " + CLOSE + " points at the final horn (5 at the half)" : "";
  if (fld) msg += " · field: " + fld.title + ", " + fld.entries.toLocaleString() + " teams" + (state.draftedOnly ? ", drafted players only" : "");
  else if (state.fieldError) msg += " · couldn't read the field (" + state.fieldError + ")";
  else if (state.fieldWait && Date.now() < state.fieldWait) msg += " · the field comes in at " + pt(new Date(state.fieldWait), { hour: "numeric", minute: "2-digit" }) + " PT, after the swaps";
  if (state.missed && !state.error) msg += " · " + state.missed + " game" + (state.missed > 1 ? "s" : "") + " didn't update this time, showing the last score";
  if (state.error) setStatus("ESPN didn't answer (" + state.error.message + "). ADP is still here; scores fill in once it does.", true);
  else setStatus(msg, false, legend);
}

// ---------------------------------------------------------------- wiring
$("slate").addEventListener("change", function () {
  setSlate(state.slates[Number(this.value)]);
  save("brr:live:slate", state.slate.label);
  state.games = {}; state.box = {}; state.finals = {};
  render(); pull();
});
$("sort").addEventListener("change", function () { state.sort = this.value; save("brr:live:sort", state.sort); render(); });
$("tail").addEventListener("change", function () {
  var v = Number(this.value);
  if (state.slate) save("brr:live:tail:" + state.slate.slate_id, isFinite(v) && v > 0 && v < TEAMS * ROUNDS ? v : null);
  render();
});
$("mine").addEventListener("click", function () { state.mine = !state.mine; render(); });
$("me").value = ME;
$("me").addEventListener("change", function () {
  ME = this.value.trim().toLowerCase(); this.value = ME;
  save("brr:live:me", ME); state.sim = null; render();
});
$("vPlayers").addEventListener("click", function () { state.view = "players"; save("brr:live:view", state.view); render(); });
$("vLineups").addEventListener("click", function () { state.view = "lineups"; save("brr:live:view", state.view); render(); });
$("drafted").addEventListener("click", function () { state.draftedOnly = !state.draftedOnly; save("brr:live:drafted", state.draftedOnly); render(); });
$("refresh").addEventListener("click", pull);
$("fold").addEventListener("click", function () { setFolded(!document.documentElement.classList.contains("folded")); });
setFolded(!!load("brr:live:folded", false));
$("upload").addEventListener("click", function () { $("file").click(); });
$("file").addEventListener("change", function () {
  var f = this.files[0];
  if (!f) return;
  f.text().then(function (t) { ingestExposure(t, f.name); });
  this.value = "";
});
/* Pull on a timer only while the tab is showing and a game hasn't finished; coming back to
   the tab pulls straight away. */
setInterval(function () {
  var open = Object.keys(state.games).some(function (t) { return state.games[t].state !== "post"; });
  if (!document.hidden && (open || !state.pulledAt)) pull();
}, EVERY * 1000);
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && state.pulledAt && Date.now() - state.pulledAt > EVERY * 500) pull();
});

/* A player's usual is ETR's median for tonight when today's ETR file was uploaded on the board
   (this browser), not its 75/25 ceiling blend, which is for ranking upside; otherwise his
   box-score usual (a few games in, Jokic's runs about 10 points over ETR's). */
function etrUsual() {
  var cur = (load("brr:proj:nba", null) || {}).current, day = { dateStyle: "short" };
  if (!cur || !cur.entries || pt(new Date(cur.at), day) !== pt(new Date(), day)) return;
  cur.entries.forEach(function (e) { if (typeof e.median === "number") state.projBy.nba[e.norm] = e.median; });
  state.projFrom = cur.file;
}

(async function boot() {
  try { state.slates = await loadSlates(); } catch (e) { setStatus("Couldn't reach the ADP mirror: " + e.message, true); return; }
  mirror("nba_morning.json").then(function (d) {
    (d.players || []).forEach(function (r) { var k = normName(r.name); state.projBy.nba[ESPN_ALIASES[k] || k] = r.fp; });
  }).catch(function () {}).then(function () { etrUsual(); render(); });
  // college: our projection is his usual; its rows also carry his ESPN athlete and game ids. A slate
  // that has locked keeps its rows as they stood at lock (locked), and they win for tonight's games.
  mirror("cbb_morning.json").then(function (d) {
    state.cbbRows = Object.assign.apply(null, [{}, d.players || {}].concat(
      Object.keys(d.locked || {}).map(function (sid) { return d.locked[sid]; })));
    Object.keys(state.cbbRows).forEach(function (pid) {
      var r = state.cbbRows[pid];
      if (r.status !== "Out" && typeof r.fp === "number") state.projBy.cbb[normName(r.name)] = r.fp;
    });
  }).catch(function () {}).then(function () { render(); if (sportOf(state.slate) === "cbb") pull(); });
  state.posted = await fetch("analysis/nba/expo.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) { return d.slates || {}; }).catch(function () { return {}; });
  fillSlates();
  render();
  pull();
})();
</script>
</body>
