<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Same committed dark theme as the board. The only new colour here is the four tiers,
     so a row reads left to right as one story: role, what the role produced, the spot. */
  :root {
    color-scheme: dark;
    --bg: #080b11;
    --surface: #12151c;
    --surface-2: #161a22;
    --input: #0d1017;
    --ink: #ffffff;
    --muted: #8b94a4;
    --line: #1c212c;
    --line-strong: #2a3140;
    --accent: #ffffff;
    --new: #a7b0be;
    --new-bg: #1b202a;
    --neutral-pill: #2a3140;
    --rb: #479580;
    --up: #4dc48d;
    --down: #f08a7e;
    /* Tiers: RB1-6, RB7-12, RB13-24, everything after. */
    --t3: #13703a;  --t3-ink: #ffffff;
    --t2: #58c07a;  --t2-ink: #06180d;
    --t1: #e0b43a;  --t1-ink: #1d1503;
    --t0: #b9443b;  --t0-ink: #ffffff;
    --tnone: #1a1e27;
    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1240px; margin: 0 auto; padding: 0 16px 64px; }

  /* ---------- masthead ---------- */
  .masthead { background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 14px 0; }
  .mast-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; margin: 0; white-space: nowrap; }
  .mast-meta {
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto;
  }
  .mast-meta b { font-weight: 500; color: var(--ink); }
  .views { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .views a {
    font-size: 12.5px; font-weight: 600; padding: 5px 12px; color: var(--muted); text-decoration: none;
  }
  .views a[aria-current="page"] { background: var(--accent); color: var(--bg); }
  .views a:not([aria-current]):hover { color: var(--ink); }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; padding-block: 12px; }
  .grow { flex: 1 1 160px; min-width: 130px; }
  label.field { display: flex; flex-direction: column; gap: 3px; }
  .field-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  select, input[type="search"] {
    font-family: var(--sans); font-size: 14px; color: var(--ink);
    background: var(--input); border: 1px solid var(--line-strong);
    border-radius: 7px; padding: 7px 9px; width: 100%; height: 34px;
  }
  input[type="search"] { -webkit-appearance: none; }
  select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; height: 34px; }
  .seg button {
    all: unset; cursor: pointer; font-size: 13.5px; font-weight: 500; padding: 0 13px;
    display: flex; align-items: center; color: var(--muted); background: var(--surface);
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); height: 34px; cursor: pointer; }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); padding-bottom: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .legend-note { font-style: normal; }
  .legend-note b { color: var(--ink); font-weight: 500; }

  .notice {
    font-size: 13.5px; border-radius: 8px; padding: 9px 12px; margin-bottom: 10px;
    border: 1px solid var(--new); background: var(--new-bg); color: var(--new);
  }
  .notice:empty { display: none; }

  /* ---------- table ---------- */
  .board { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  /* One grid for header and rows so every cell lines up with its column label. */
  .row {
    display: grid;
    grid-template-columns: 40px minmax(130px, 200px) repeat(4, minmax(84px, 1fr)) var(--base) var(--base) 62px 100px;
    --base: 76px;
    align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .head {
    background: var(--surface-2); position: sticky; top: 0; z-index: 5;
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); padding-block: 8px; border-radius: 9px 9px 0 0; align-items: end;
  }
  .head .sub { display: block; font-size: 9px; letter-spacing: .04em; text-transform: none; opacity: .8; margin-top: 2px; }
  .player-row { cursor: pointer; }
  .player-row:hover { background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); }
  .player-row[aria-expanded="true"] { background: var(--surface-2); border-bottom-color: transparent; }

  .rank { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
  /* Drag grip: only in the slate view sorted by board order, where the order is yours. */
  .grip {
    all: unset; cursor: grab; touch-action: none; color: var(--muted); font-size: 14px; line-height: 1;
    padding: 4px 2px; border-radius: 4px; opacity: .55;
  }
  .grip:hover, .grip:focus-visible { opacity: 1; color: var(--ink); }
  .grip:focus-visible { outline: 2px solid var(--accent); }
  .player-row.dragging { opacity: .45; }
  .player-row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .player-row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
  .line-row {
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    padding: 5px 12px; border-bottom: 1px solid var(--line); border-top: 2px dashed var(--line-strong); background: var(--bg);
  }
  .who { min-width: 0; display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .tag {
    font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; background: var(--neutral-pill); color: var(--ink); white-space: nowrap;
  }
  .tag.up { background: color-mix(in srgb, var(--up) 22%, transparent); color: var(--up); }
  .tag.down { background: color-mix(in srgb, var(--down) 22%, transparent); color: var(--down); }
  .tag.split { background: color-mix(in srgb, var(--t1) 22%, transparent); color: var(--t1); }

  /* A group is the 16-game cell, a hairline, then up to four games, oldest to newest. */
  /* Each stat sits on its own faint panel so neighbouring stats don't run together. */
  .grp {
    display: grid; grid-template-columns: 1fr 1px repeat(4, 1fr); gap: 3px; align-items: center;
    background: #0c0f15; border: 1px solid var(--line); border-radius: 6px; padding: 3px;
  }
  .grp.base { grid-template-columns: 1fr 1px 1fr; }
  .head .grp-label { border-bottom: 2px solid var(--line-strong); padding-bottom: 4px; }
  .grp .div { width: 1px; height: 18px; background: var(--line-strong); justify-self: center; }
  .cell {
    font-family: var(--mono); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums;
    text-align: center; border-radius: 4px; height: 24px; line-height: 24px; background: var(--tnone); color: var(--muted);
  }
  .cell.t3 { background: var(--t3); color: var(--t3-ink); }
  .cell.t2 { background: var(--t2); color: var(--t2-ink); }
  .cell.t1 { background: var(--t1); color: var(--t1-ink); }
  .cell.t0 { background: var(--t0); color: var(--t0-ink); }
  .cell.l16 { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .28); }
  .cell.blank { background: transparent; }
  .head .grp { text-align: center; }

  /* Workload score: expected points next game, coloured by its rank at the position. */
  .inj {
    font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 1px 4px; border-radius: 4px;
    background: var(--t1); color: var(--t1-ink); white-space: nowrap; align-self: center;
  }
  .inj.d { background: #e07b3a; color: #1d0e03; }
  .inj.o { background: var(--t0); color: var(--t0-ink); }
  .inj.p { background: #2a3140; color: #c9d1dc; }
  .sc { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .sc .cell { min-width: 48px; font-size: 12px; }
  .sc .cell.thin { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .55); background-image: repeating-linear-gradient(135deg, transparent 0 4px, rgba(0, 0, 0, .18) 4px 6px); }
  .sc .vs { font-family: var(--mono); font-size: 10px; color: var(--muted); line-height: 1.1; }
  .sc .vs.up { color: var(--up); } .sc .vs.down { color: var(--down); }
  .mu { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .mu .cell { padding: 0 6px; min-width: 56px; font-size: 10.5px; letter-spacing: .03em; }

  /* ---------- drawer ---------- */
  .drawer { background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 4px 16px 16px 50px; }
  .drawer h3 {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 14px 0 6px; font-weight: 600;
  }
  .drawer h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; opacity: .8; }
  .log { border-collapse: collapse; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .log th { font-weight: 500; color: var(--muted); text-align: right; padding: 3px 9px; font-size: 10.5px; }
  .log td { text-align: right; padding: 3px 9px; border-top: 1px solid var(--line); }
  .log th:first-child, .log td:first-child { text-align: left; }
  .log td.t3, .log td.t2, .log td.t1, .log td.t0 { font-weight: 600; }
  .log td.t3 { color: #5fd88d; } .log td.t2 { color: #9ae6b4; } .log td.t1 { color: #f1cf6b; } .log td.t0 { color: #f39b92; }
  .takes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .takes li { font-size: 13.5px; line-height: 1.4; }
  .takes .top { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; }
  .takes .src { font-weight: 600; }
  .takes .ev { color: var(--muted); font-family: var(--mono); font-size: 12px; display: block; margin-top: 2px; }
  .takes .norm { display: inline-flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .takes .norm .cell { display: inline-block; height: 18px; line-height: 18px; padding: 0 6px; font-size: 10px; letter-spacing: .04em; }
  .takes .job { font-family: var(--mono); font-size: 10.5px; color: var(--ink); text-transform: uppercase; letter-spacing: .04em; }
  .takes .stance { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .takes .blurb { display: block; color: var(--muted); margin-top: 1px; }
  .model { font-size: 13.5px; margin-bottom: 8px; }
  .model b { font-weight: 600; }
  .none { color: var(--muted); font-size: 13px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }

  .empty { padding: 28px 14px; text-align: center; color: var(--muted); font-size: 14px; }
  .footnote { color: var(--muted); font-size: 12.5px; margin-top: 12px; line-height: 1.6; }

  /* Narrower screens drop the numbers inside the game cells first; the tier colour
     carries the read and the drawer has every number. */
  @media (max-width: 1180px) {
    .row { --base: 62px; gap: 8px; }
    .grp { padding: 2px; gap: 2px; }
    .cell { font-size: 10px; }
    .grp:not(.base) .cell:not(.l16) { font-size: 0; }
  }
  /* A phone gets two lines per player: who and the matchup, then the colour strips. */
  @media (max-width: 880px) {
    .shell { padding: 0 10px 48px; }
    .row {
      --base: 1fr;
      grid-template-columns: 34px minmax(0, 1fr) auto auto;
      grid-template-areas: "rank who sc mu" "strip strip strip strip";
      gap: 6px 8px; padding: 8px;
    }
    .row > .rank { grid-area: rank; }
    .row > .who { grid-area: who; }
    .row > .mu { grid-area: mu; }
    .row > .sc { grid-area: sc; flex-direction: column-reverse; }
    .row > .strip { grid-area: strip; display: grid; grid-template-columns: repeat(4, 1fr) .5fr .5fr; gap: 6px; }
    .strip .grp { gap: 2px; }
    .strip .cell { height: 14px; line-height: 14px; border-radius: 3px; font-size: 0 !important; }
    .grp .div { height: 12px; }
    .head { display: none; }
    .phone-key { display: grid !important; }
    .drawer { padding: 4px 10px 14px; }
    .cols { grid-template-columns: 1fr; }
    .log { font-size: 11px; }
    .log th, .log td { padding: 3px 5px; }
    .mast-meta { margin-left: 0; }
  }
  .strip { display: contents; }
  .phone-key {
    display: none; grid-template-columns: repeat(4, 1fr) .5fr .5fr; gap: 6px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    padding: 8px 8px 0;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="masthead">
    <div class="mast-row">
      <h1>Workload</h1>
      <nav class="views" aria-label="Pages">
        <a href="./">Board</a>
        <a href="analysis.html" aria-current="page">Analysis</a>
      </nav>
      <div class="mast-meta" id="meta"></div>
    </div>
    <div class="controls">
      <label class="field">
        <span class="field-label">Show</span>
        <span class="seg" role="group" aria-label="Which players">
          <button type="button" id="scopeSlate" aria-pressed="false">This slate</button>
          <button type="button" id="scopeAll" aria-pressed="true">All players</button>
        </span>
      </label>
      <label class="field">
        <span class="field-label">Position</span>
        <span class="seg" role="group" aria-label="Position" id="posSeg">
          <button type="button" data-pos="" aria-pressed="true">All</button>
          <button type="button" data-pos="RB" aria-pressed="false">RB</button>
          <button type="button" data-pos="WR" aria-pressed="false">WR</button>
          <button type="button" data-pos="TE" aria-pressed="false">TE</button>
        </span>
      </label>
      <label class="field" id="slateField" hidden>
        <span class="field-label">Slate</span>
        <select id="slate"></select>
      </label>
      <label class="field grow">
        <span class="field-label">Search</span>
        <input type="search" id="search" placeholder="name" autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">Team</span>
        <select id="team"><option value="">All teams</option></select>
      </label>
      <label class="field">
        <span class="field-label">Sort</span>
        <select id="sort">
          <option value="board" id="sortBoard" hidden>Board order</option>
          <option value="score">Workload score</option>
          <option value="vsproj">Score vs your projection</option>
          <option value="adp">Underdog ADP</option>
          <option value="xfp4">XFP, last 4</option>
          <option value="xfp16">XFP, last 16</option>
          <option value="fp4">FP, last 4</option>
          <option value="share16">Usage (RB) · Target % (WR/TE), L16</option>
          <option value="snap1">Snap % (RB) · Route %, last game</option>
          <option value="role">Role change (last game vs L16)</option>
          <option value="matchup">Matchup</option>
          <option value="team">Team</option>
          <option value="name">Name</option>
        </select>
      </label>
      <label class="check" id="depthField"><input type="checkbox" id="depth" checked> Hide deep backups</label>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="board">
    <div class="row head" id="head"></div>
    <div class="phone-key" id="phoneKey" aria-hidden="true"></div>
    <div id="rows"><div class="empty">Loading&hellip;</div></div>
  </div>

  <p class="footnote" id="foot"></p>
</div>

<script>
"use strict";

// ==== PURE LOGIC START (no DOM) ====
var MIRROR = "https://raw.githubusercontent.com/JonBoyBeats/br-adp-mirror/main/";
var TIER_NAMES = ["Replacement", "Average", "Great", "Elite"];
var TIER_INDEX = { Replacement: 0, Average: 1, Great: 2, Elite: 3, Tough: 0 };
var POS_ORDER = ["RB", "WR", "TE"];
/* A last-game snap share this far off the 16-game rate is a role change worth a label:
   about half of such a jump carries into the next game, a big points game carries almost none. */
var ROLE_SWING = 0.15;
/* "Deep backup": no real share of the work lately. */
var DEPTH_XFP = 4, DEPTH_SNAP = 0.25;

/** Strip suffixes and punctuation so two spellings of one player collide (same as the board). */
function normName(s) {
  return String(s == null ? "" : s)
    .toLowerCase()
    .replace(/[‘’'`.]/g, "")
    .replace(/[-‐-―]/g, " ")
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, " ")
    .replace(/[^a-z0-9 ]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/** Tier index 0..3 against [elite, great, average] lines; null when there is no value. */
function tierOf(v, cuts) {
  if (v == null || !cuts) return null;
  return v >= cuts[0] ? 3 : v >= cuts[1] ? 2 : v >= cuts[2] ? 1 : 0;
}

function pct(v) { return v == null ? "–" : String(Math.round(v * 100)); }
function pts(v) { return v == null ? "–" : v.toFixed(1); }

/** Role change: last game's snap share (RB) or route share (WR/TE) against the 16-game rate. */
function roleKey(p) { return p.pos === "RB" ? "snap" : "route"; }
function roleSwing(p) {
  var g = p.games[p.games.length - 1], k = roleKey(p);
  if (!g || g[k] == null || p.l16[k] == null || p.l16_games < 4) return 0;
  return g[k] - p.l16[k];
}

function relevant(p) {
  var g = p.games[p.games.length - 1];
  return (p.l4.xfp || 0) >= DEPTH_XFP || (g && (g.snap || 0) >= DEPTH_SNAP);
}

/**
 * One player's takes for the current weeks only: recaps of the last week played and
 * previews of the next one. Nothing older carries over; a source that skipped him is absent.
 */
function takesFor(all, key, recapWeek, previewWeek) {
  var mine = all.filter(function (t) { return t._key === key; });
  function of(kind, wk) {
    return { week: wk, list: mine.filter(function (t) { return t.kind === kind && t.week === wk; }) };
  }
  return { perf: of("performance", recapWeek), match: of("matchup", previewWeek) };
}

/* The board's own order rules, copied so a drag here lands exactly as it would there. */
function moveWithin(order, dragId, targetId, before) {
  if (dragId === targetId) return order.slice();
  var out = order.filter(function (p) { return p !== dragId; });
  var at = out.indexOf(targetId);
  if (at < 0) return order.slice();
  out.splice(before ? at : at + 1, 0, dragId);
  return out;
}
function clampCut(cut, len) {
  if (cut == null || String(cut).trim() === "") return null;
  var n = Math.round(Number(cut));
  if (!isFinite(n)) return null;
  return Math.max(0, Math.min(len, n));
}
function moveAcrossCut(order, cut, pid, nextOrder) {
  var at = clampCut(cut, order.length);
  var from = order.indexOf(pid), to = nextOrder.indexOf(pid);
  if (at == null || from < 0 || to < 0) return { order: nextOrder, cut: cut, moved: true, refused: false };
  if (from >= at && to > at) return { order: order.slice(), cut: at, moved: false, refused: true };
  var next = at;
  if (from >= at) next = at + 1;
  else if (to >= at) next = at - 1;
  return { order: nextOrder, cut: clampCut(next, nextOrder.length), moved: true, refused: false };
}

/**
 * The board's saved order for a slate, never shortened: ids the slate no longer lists
 * (players you added from the unpriced pool) stay put, and slate players the board
 * hasn't placed yet go on the end by ADP, as the board itself would put them.
 */
function fullOrder(slatePlayers, saved) {
  var seen = {}, order = [];
  (saved || []).forEach(function (pid) { if (!seen[pid]) { seen[pid] = 1; order.push(pid); } });
  var fresh = slatePlayers.filter(function (p) { return !seen[p.player_id]; })
    .sort(function (a, b) { return (typeof a.adp === "number" ? a.adp : Infinity) - (typeof b.adp === "number" ? b.adp : Infinity); });
  return order.concat(fresh.map(function (p) { return p.player_id; }));
}
// ==== PURE LOGIC END ====

var state = {
  data: null, takes: [], sources: {}, positions: {}, matchups: {},
  scope: "all", pos: "", slateLabel: null, slates: [], nameMap: {}, pool: {},
  search: "", team: "", sort: "score", depth: true, open: {}, proj: {}, projPct: 85, projUsual: {}
};
var $ = function (id) { return document.getElementById(id); };
function load(key, fallback) {
  try { var raw = localStorage.getItem(key); return raw == null ? fallback : JSON.parse(raw); }
  catch (e) { return fallback; }
}
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private window */ } }

async function getJson(url) {
  var r = await fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(url + ": HTTP " + r.status);
  return r.json();
}

function cfg(p) { return state.positions[p.pos]; }
function shownPositions() { return state.pos ? [state.pos] : POS_ORDER; }
function matchupOf(p) { var m = state.matchups[p.pos]; return m ? m[p.team] : null; }

// ---------------------------------------------------------------- slate
/* The slate view reads what the board keeps in this browser: the picked slate, your
   order and the line. Dragging here writes the order back, so both pages stay one board. */
async function loadSlates() {
  try {
    var latest = await getJson(MIRROR + "latest.json");
    state.slates = (latest.slates || []).filter(function (s) { return s.sport === "nfl"; });
    try { var m = await getJson(MIRROR + "nfl_name_map.json"); delete m._comment; state.nameMap = m; } catch (e) { state.nameMap = {}; }
  } catch (e) { state.slates = []; }
  var sel = $("slate");
  sel.innerHTML = "";
  state.slates.forEach(function (s) {
    var o = document.createElement("option");
    o.value = s.label; o.textContent = s.title || s.label;
    sel.appendChild(o);
  });
  var want = load("brr:slate", null);
  var hit = state.slates.find(function (s) { return s.label === want; }) || state.slates[0];
  state.slateLabel = hit ? hit.label : null;
  if (hit) sel.value = hit.label;
}

/** Underdog's ADP and injury designation for a player, from the slate picked above. */
var udCache = { label: null, map: {} };
function udFor(p) {
  var s = currentSlate();
  if (!s) return null;
  if (udCache.label !== s.label) {
    udCache = { label: s.label, map: {} };
    slatePlayers(s).forEach(function (u) {
      var full = (u.first_name + " " + u.last_name).replace(/\s+/g, " ").trim();
      udCache.map[normName(state.nameMap[full] || full) + "|" + u.position] = { adp: typeof u.adp === "number" ? u.adp : null, injury: u.injury || null };
    });
  }
  return udCache.map[normName(p.name) + "|" + p.pos] || null;
}

/** Underdog's designation, when the mirror carries one: Q, D, O and anything else as sent. */
function injuryTag(status) {
  if (!status) return null;
  var t = String(status).trim(), k = t.charAt(0).toUpperCase();
  var short = { Q: "Q", D: "D", O: "O", P: "P" }[k] || t;
  if (/^ir|reserve/i.test(t)) short = "IR";
  var el = document.createElement("span");
  el.className = "inj" + (k === "P" ? " p" : k === "D" ? " d" : (k === "O" || short === "IR" || /^sus|^pup|^nfi/i.test(t)) ? " o" : "");
  el.textContent = short;
  el.title = "Underdog: " + t;
  return el;
}

function currentSlate() { return state.slates.find(function (x) { return x.label === state.slateLabel; }); }

/** Pool players the board added to this slate, fetched once so they show here too. */
async function loadAdded(s) {
  var ids = load("brr:added:" + s.label, null) || [];
  if (!ids.length || !s.pool || state.pool[s.label]) return;
  try {
    var doc = await getJson(MIRROR + s.pool);
    state.pool[s.label] = doc.players || [];
    udCache.label = null;
  } catch (e) { state.pool[s.label] = []; }
}

function slatePlayers(s) {
  var ids = {};
  (load("brr:added:" + s.label, null) || []).forEach(function (id) { ids[id] = 1; });
  var have = {};
  s.players.forEach(function (p) { have[p.player_id] = 1; });
  var extra = (state.pool[s.label] || []).filter(function (p) { return ids[p.player_id] && !have[p.player_id]; });
  return s.players.concat(extra);
}

function boardState(s) {
  var order = fullOrder(s.players, load("brr:order:" + s.label, null));
  return { order: order, cut: clampCut(load("brr:cut:" + s.label, null), order.length) };
}

/** Slate players in board order, each joined to its workload row by name (then last name + team). */
function slateRows() {
  var s = currentSlate();
  if (!s) return { rows: [], missing: [], cut: null };
  var b = boardState(s);
  var at = {};
  b.order.forEach(function (pid, i) { at[pid] = i; });
  var want = {};
  shownPositions().forEach(function (x) { want[x] = 1; });
  var list = slatePlayers(s).filter(function (p) { return want[p.position]; });
  list.sort(function (a, b2) {
    var x = at[a.player_id], y = at[b2.player_id];
    if (x != null && y != null) return x - y;
    if (x != null) return -1;
    if (y != null) return 1;
    return (a.adp || 999) - (b2.adp || 999);
  });
  var byName = {}, byLast = {};
  state.data.players.forEach(function (p) {
    byName[normName(p.name) + "|" + p.pos] = p;
    var parts = normName(p.name).split(" ");
    byLast[parts[parts.length - 1] + "|" + p.team + "|" + p.pos] = p;
  });
  var rows = [], missing = [];
  list.forEach(function (u) {
    var full = (u.first_name + " " + u.last_name).replace(/\s+/g, " ").trim();
    var key = normName(state.nameMap[full] || full);
    var p = byName[key + "|" + u.position] || byLast[normName(u.last_name).split(" ").pop() + "|" + u.team + "|" + u.position];
    if (p) rows.push({ p: p, pid: u.player_id, idx: at[u.player_id] != null ? at[u.player_id] : null });
    else missing.push(full);
  });
  return { rows: rows, missing: missing, cut: b.cut };
}

/** Drop one slate player before or after another, with the board's line rules. */
function commitMove(pid, targetPid, before) {
  var s = currentSlate();
  if (!s || pid === targetPid) return;
  var b = boardState(s);
  var res = moveAcrossCut(b.order, b.cut, pid, moveWithin(b.order, pid, targetPid, before));
  if (res.refused) {
    flash("Below the line the board sorts by projection, so that move would snap straight back. Drag him above the line to rank him.");
    return;
  }
  save("brr:order:" + s.label, res.order);
  if (res.cut == null) { try { localStorage.removeItem("brr:cut:" + s.label); } catch (e) { /* ignore */ } }
  else save("brr:cut:" + s.label, res.cut);
  render();
  var moved = document.querySelector('.player-row[data-pid="' + pid + '"] .grip');
  if (moved) moved.focus({ preventScroll: true });
}

/* A refused move explains itself for a few seconds, across re-renders. */
var flashMsg = null, flashUntil = 0;
function flash(text) {
  flashMsg = text; flashUntil = Date.now() + 4500;
  $("notice").textContent = text;
  setTimeout(function () { if (Date.now() >= flashUntil) render(); }, 4600);
}

function draggable() { return state.scope === "slate" && state.sort === "board"; }

// ---------------------------------------------------------------- rows
function visible() {
  var list, missing = [], cut = null;
  if (state.scope === "slate") {
    var got = slateRows();
    list = got.rows; missing = got.missing; cut = got.cut;
  } else {
    var want = {};
    shownPositions().forEach(function (x) { want[x] = 1; });
    list = state.data.players.filter(function (p) { return want[p.pos]; }).map(function (p) { return { p: p, idx: null }; });
    if (state.depth) list = list.filter(function (r) { return relevant(r.p); });
  }
  var q = normName(state.search);
  if (q) list = list.filter(function (r) { return normName(r.p.name).indexOf(q) >= 0; });
  if (state.team) list = list.filter(function (r) { return r.p.team === state.team; });

  var mu = function (p) { var m = matchupOf(p); return m ? m.rank : 99; };
  var last = function (p, k) { var g = p.games[p.games.length - 1]; return g && g[k] != null ? g[k] : -1; };
  var by = {
    xfp4: function (p) { return -(p.l4.xfp || 0); },
    xfp16: function (p) { return -(p.l16.xfp || 0); },
    fp4: function (p) { return -(p.l4.fp || 0); },
    share16: function (p) { return -(p.l16[p.pos === "RB" ? "usage" : "tgt"] || 0); },
    snap1: function (p) { return -last(p, roleKey(p)); },
    role: function (p) { return -Math.abs(roleSwing(p)); },
    matchup: mu,
    score: function (p) { return p.score ? -p.score.next : 99; },
    adp: function (p) { var u = udFor(p); return u && u.adp != null ? u.adp : 999; },
    vsproj: function (p) { var v = vsProj(p); return v == null ? 99 : -v.delta; }
  }[state.sort];
  if (state.sort === "name") list.sort(function (a, b) { return a.p.name.localeCompare(b.p.name); });
  else if (state.sort === "team") list.sort(function (a, b) { return a.p.team.localeCompare(b.p.team) || (b.p.l4.xfp || 0) - (a.p.l4.xfp || 0); });
  else if (by) list.sort(function (a, b) { return by(a.p) - by(b.p); });
  return { list: list, missing: missing, cut: cut };
}

function cell(v, t, fmt, extra, title) {
  var c = document.createElement("span");
  c.className = "cell" + (t == null ? "" : " t" + t) + (extra ? " " + extra : "");
  c.textContent = fmt(v);
  if (title) c.title = title;
  return c;
}

function roleGroup(p, stat, label) {
  var c = cfg(p), cuts = c.cuts[stat];
  var g = document.createElement("span");
  g.className = "grp";
  var t16 = tierOf(p.l16[stat], cuts.l16);
  g.appendChild(cell(p.l16[stat], t16, pct, "l16",
    label + ", last " + p.l16_games + " games: " + pct(p.l16[stat]) + (t16 == null ? "" : " · " + TIER_NAMES[t16] + " (" + c.tiers[t16] + " level)")));
  g.appendChild(document.createElement("span")).className = "div";
  var games = p.games.slice(-4);
  for (var i = 0; i < 4; i++) {
    var gm = games[i - (4 - games.length)];
    if (!gm) { g.appendChild(cell(null, null, function () { return ""; }, "blank")); continue; }
    var t = tierOf(gm[stat], cuts.game);
    g.appendChild(cell(gm[stat], t, pct, null,
      "Wk " + gm.wk + " vs " + gm.opp + " · " + label + " " + pct(gm[stat]) +
      (t == null ? (/rz/.test(stat) ? " · no team red-zone plays" : "") : " · " + TIER_NAMES[t])));
  }
  return g;
}

function baseGroup(p, stat, label) {
  var cuts = cfg(p).cuts[stat];
  var g = document.createElement("span");
  g.className = "grp base";
  var a = tierOf(p.l16[stat], cuts.l16), b = tierOf(p.l4[stat], cuts.l4);
  g.appendChild(cell(p.l16[stat], a, pts, "l16", label + " per game, last " + p.l16_games + " games" + (a == null ? "" : " · " + TIER_NAMES[a])));
  g.appendChild(document.createElement("span")).className = "div";
  g.appendChild(cell(p.l4[stat], b, pts, null, label + " per game, last " + p.games.length + " this season" + (b == null ? "" : " · " + TIER_NAMES[b])));
  return g;
}

/** The score, and under it how far it sits from your own projection (same blend). */
function scoreCell(p) {
  var w = document.createElement("span");
  w.className = "sc";
  var sc = p.score;
  if (!sc) { w.appendChild(cell(null, null, function () { return "–"; })); return w; }
  var thin = p.l16_games < 4;
  w.appendChild(cell(sc.next, sc.tier, pts, thin ? "thin" : null,
    "Expected " + sc.next.toFixed(1) + " half-PPR next game · " + p.pos + sc.rank + " this week" +
    (thin ? " · only " + p.l16_games + " game" + (p.l16_games === 1 ? "" : "s") + " of data, so lean on it lightly" : "")));
  var v = vsProj(p);
  if (!v && state.projMeta) {           // keep the row's height, so every score lines up
    var gap = document.createElement("span"); gap.className = "vs"; gap.innerHTML = "&nbsp;"; w.appendChild(gap);
  }
  if (v) {
    var d = document.createElement("span");
    d.className = "vs" + (v.delta >= 1 ? " up" : v.delta <= -1 ? " down" : "");
    d.textContent = (v.delta > 0 ? "+" : "") + v.delta.toFixed(1);
    d.title = "Workload blend " + v.ours.toFixed(1) + " vs your projection " + v.theirs.toFixed(1) + " (25% median + 75% ceiling on both sides): " +
      (v.raw > 0 ? "+" : "") + v.raw.toFixed(1) + ", against a usual " + (v.usual > 0 ? "+" : "") + v.usual.toFixed(1) + " for " + p.pos + "s";
    w.appendChild(d);
  }
  return w;
}

/**
 * Your board projection for a player and ours on the same footing: 25% median + 75%
 * ceiling, with our ceiling at whichever percentile (80th or 85th) your ceilings sit
 * closest to across the players both sides cover.
 */
function vsProj(p) {
  var e = state.proj[normName(p.name)];
  if (!e || !p.score) return null;
  var ceil = state.projPct === 80 ? p.score.p80 : p.score.p85;
  var ours = 0.25 * p.score.p50 + 0.75 * ceil, raw = ours - e.proj, usual = state.projUsual[p.pos] || 0;
  return { ours: ours, theirs: e.proj, raw: raw, usual: usual, delta: raw - usual, median: e.median, ceiling: e.ceiling };
}

function loadProjections() {
  var raw = load("brr:proj:nfl", null);
  var gen = raw && (raw.entries ? raw : raw.current);
  state.proj = {}; state.projMeta = null; state.projUsual = {};
  if (!gen || !gen.entries) return;
  gen.entries.forEach(function (e) {
    if (typeof e.median !== "number") return;
    var ceiling = typeof e.ceiling === "number" ? e.ceiling : null;
    var proj = typeof e.proj === "number" ? e.proj : ceiling == null ? e.median : 0.25 * e.median + 0.75 * ceiling;
    state.proj[normName(e.name)] = { median: e.median, ceiling: ceiling, proj: proj };
  });
  // which of our percentiles your ceilings look like, by the ceiling-to-median ratio
  var theirs = [], r80 = [], r85 = [];
  state.data.players.forEach(function (p) {
    var e = state.proj[normName(p.name)];
    if (!e || e.ceiling == null || !p.score || !(e.median > 3) || !(p.score.p50 > 3)) return;
    theirs.push(e.ceiling / e.median); r80.push(p.score.p80 / p.score.p50); r85.push(p.score.p85 / p.score.p50);
  });
  var avg = function (a) { return a.reduce(function (s, x) { return s + x; }, 0) / a.length; };
  if (theirs.length) state.projPct = Math.abs(avg(r80) - avg(theirs)) < Math.abs(avg(r85) - avg(theirs)) ? 80 : 85;
  // the usual gap at each position, so the number shown is relative: + means the workload
  // likes him more than your projection does, compared with how the two usually line up
  state.projUsual = {};
  POS_ORDER.forEach(function (pos) {
    var gaps = [];
    state.data.players.forEach(function (p) {
      if (p.pos !== pos) return;
      var v = vsProj(p);
      if (v) gaps.push(v.raw);
    });
    gaps.sort(function (a, b) { return a - b; });
    state.projUsual[pos] = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 0;
  });
  state.projMeta = { file: gen.file || null, at: gen.at || null, matched: theirs.length };
}

function muCell(p) {
  var m = matchupOf(p);
  var w = document.createElement("span");
  w.className = "mu";
  if (!m) { w.textContent = "Bye"; return w; }
  var t = 3 - ["Elite", "Great", "Average", "Tough"].indexOf(m.tier);
  var c = cell(null, t, function () { return m.tier === "Average" ? "Avg" : m.tier; }, null,
    "Week " + state.data.next_week + (m.home ? " vs " : " @ ") + m.opp + ": #" + m.rank + " of 32 for " + p.pos + "s");
  var o = document.createElement("span");
  o.textContent = (m.home ? "" : "@") + m.opp;
  w.append(c, o);
  return w;
}

/** Column labels for whichever positions are showing, e.g. "Carry % (RB) · Target %" for all. */
function statLabels() {
  return [0, 1, 2, 3].map(function (i) {
    var seen = [];
    shownPositions().forEach(function (x) {
      var st = state.positions[x].stats[i];
      if (seen.indexOf(st[1]) < 0) seen.push(st[1]);
    });
    return seen.map(function (l, j) { return seen.length > 1 && j === 0 ? l + " (RB)" : l; }).join(" · ");
  });
}

function renderHead() {
  var labels = statLabels();
  var h = '<span></span><span>Player</span>';
  // break between labels, never inside one ("Air yd %" stays whole)
  labels.forEach(function (l) {
    var parts = l.split(" · ").map(function (x) { return '<span style="white-space:nowrap">' + x + "</span>"; }).join(" · ");
    h += '<span class="grp-label" style="text-align:center">' + parts + '<span class="sub">L16 ¦ last 4</span></span>';
  });
  h += '<span style="text-align:center">XFP<span class="sub">L16 ¦ L4</span></span>' +
       '<span style="text-align:center">FP<span class="sub">L16 ¦ L4</span></span>' +
       '<span style="text-align:center" title="Workload score: expected half-PPR next game. Under it, the gap to your projection.">Score<span class="sub">next game</span></span>' +
       '<span>Matchup<span class="sub">Week ' + state.data.next_week + '</span></span>';
  $("head").innerHTML = h;
  $("phoneKey").innerHTML = labels.map(function (l) { return "<span>" + l.replace(/ %| \(RB\)/g, "").replace("Air yd", "AY") + "</span>"; }).join("") + "<span>XFP</span><span>FP</span>";
  var lg = "";
  var ranges = function (t) { return shownPositions().map(function (x) { return state.positions[x].tiers[t]; }).join(" · "); };
  [3, 2, 1, 0].forEach(function (t) { lg += '<span><i style="background:var(--t' + t + ')"></i>' + TIER_NAMES[t] + " · " + ranges(t) + "</span>"; });
  lg += '<em class="legend-note">Each stat: <b>L16</b> (outlined) ¦ last 4 games, oldest → newest. Tap a player for the numbers and sources.' +
        (state.scope === "slate" ? (draggable() ? " Drag <b>⠿</b> to reorder; the board follows." : " Sort by <b>Board order</b> to drag.") : "") + "</em>";
  $("legend").innerHTML = lg;
}

function render() {
  renderHead();
  var got = visible();
  var host = $("rows");
  host.innerHTML = "";
  $("notice").textContent = "";
  if (state.scope === "slate") {
    if (!state.slates.length) $("notice").textContent = "Couldn't reach the board's slate mirror, so there's no slate to show. All players still works.";
    else if (got.missing.length) $("notice").textContent = got.missing.length + " slate player" + (got.missing.length === 1 ? " has" : "s have") +
      " no workload data (no " + state.data.season + " snaps, or a name spelled differently): " + got.missing.join(", ");
  }
  if (flashMsg && Date.now() < flashUntil) $("notice").textContent = flashMsg;
  if (!got.list.length) {
    host.innerHTML = '<div class="empty">No players match these filters.</div>';
    renderFoot(0);
    return;
  }
  var drag = draggable(), lineAt = drag ? got.cut : null, lineShown = false;
  var frag = document.createDocumentFragment();
  got.list.forEach(function (r, i) {
    if (lineAt != null && !lineShown && r.idx != null && r.idx >= lineAt) {
      lineShown = true;
      var ln = document.createElement("div");
      ln.className = "line-row";
      ln.textContent = "The line · below it the board sorts by projection";
      frag.appendChild(ln);
    }
    frag.appendChild(playerRow(r, i, drag));
    if (state.open[r.p.id]) frag.appendChild(drawer(r.p));
  });
  host.appendChild(frag);
  renderFoot(got.list.length);
}

function playerRow(r, i, drag) {
  var p = r.p;
  var el = document.createElement("div");
  el.className = "row player-row";
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.setAttribute("aria-expanded", String(!!state.open[p.id]));
  el.dataset.id = p.id;
  if (r.pid) el.dataset.pid = r.pid;

  var rank = document.createElement("span");
  rank.className = "rank";
  if (drag && r.pid) {
    var gr = document.createElement("button");
    gr.type = "button"; gr.className = "grip"; gr.textContent = "⠿";
    gr.setAttribute("aria-label", "Move " + p.name + " (arrow keys)");
    rank.appendChild(gr);
  }
  rank.appendChild(document.createTextNode(r.idx != null ? r.idx + 1 : i + 1));
  rank.title = r.idx != null ? "Your board rank" : "Row number";

  var who = document.createElement("span");
  who.className = "who";
  var n = document.createElement("span"); n.className = "name"; n.textContent = p.name;
  var ud = udFor(p);
  var tm = document.createElement("span"); tm.className = "team";
  tm.textContent = p.team + (state.pos ? "" : " · " + p.pos) + (ud && ud.adp != null ? " · ADP " + ud.adp.toFixed(1) : "");
  who.append(n, tm);
  var inj = ud && injuryTag(ud.injury);
  if (inj) who.appendChild(inj);

  var strip = document.createElement("span");
  strip.className = "strip";
  cfg(p).stats.forEach(function (s) { strip.appendChild(roleGroup(p, s[0], s[1])); });
  strip.appendChild(baseGroup(p, "xfp", "Expected points"));
  strip.appendChild(baseGroup(p, "fp", "Fantasy points"));

  el.append(rank, who, strip, scoreCell(p), muCell(p));
  return el;
}

function drawer(p) {
  var d = document.createElement("div");
  d.className = "drawer";
  var t = p._takes, c = cfg(p);

  // game log with every number the colours stand for
  var h = document.createElement("h3");
  h.innerHTML = "Game log <small>half-PPR</small>";
  d.appendChild(h);
  var tbl = document.createElement("table");
  tbl.className = "log";
  var head = "<tr><th>Games</th>" + c.stats.map(function (s) { return "<th>" + s[1].replace(/ %$/, "") + "</th>"; }).join("") + "<th>XFP</th><th>FP</th></tr>";
  function td(v, fmt, cuts) { var tt = tierOf(v, cuts); return "<td" + (tt == null ? "" : ' class="t' + tt + '"') + ">" + fmt(v) + "</td>"; }
  var body = "<tr><td>Last " + p.l16_games + "</td>" +
    c.stats.map(function (s) { return td(p.l16[s[0]], pct, c.cuts[s[0]].l16); }).join("") +
    td(p.l16.xfp, pts, c.cuts.xfp.l16) + td(p.l16.fp, pts, c.cuts.fp.l16) + "</tr>";
  p.games.slice().reverse().forEach(function (g) {
    body += "<tr><td>Wk " + g.wk + " " + g.opp + "</td>" +
      c.stats.map(function (s) { return td(g[s[0]], pct, c.cuts[s[0]].game); }).join("") +
      "<td>" + pts(g.xfp) + "</td><td>" + pts(g.fp) + "</td></tr>";
  });
  tbl.innerHTML = head + body;
  d.appendChild(tbl);

  // the score: what it expects, what it is made of, and how it sits against your projection
  if (p.score) {
    var sc = p.score, hs = document.createElement("h3");
    hs.innerHTML = "Workload score <small>Week " + state.data.next_week + "</small>";
    d.appendChild(hs);
    var sign = function (v) { return (v >= 0 ? "+ " : "− ") + Math.abs(v).toFixed(1); };
    var lines = [
      "<b>" + sc.next.toFixed(1) + "</b> expected half-PPR · " + p.pos + sc.rank + " this week · next 3 games: " + sc.next3.toFixed(1) + " a game",
      "= " + sc.parts.baseline.toFixed(1) + " baseline " + sign(sc.parts.role) + " role " + sign(sc.parts.matchup) + " matchup",
      "Players at this score posted: median " + sc.p50.toFixed(1) + " · 80th percentile " + sc.p80.toFixed(1) + " · 85th " + sc.p85.toFixed(1)
    ];
    var v = vsProj(p);
    if (v) lines.push("Your projection: median " + v.median.toFixed(1) + (v.ceiling != null ? " · ceiling " + v.ceiling.toFixed(1) : "") +
      " · blend " + v.theirs.toFixed(1) + ". Workload blend " + v.ours.toFixed(1) + " (ceiling at our " + state.projPct + "th): " +
      (v.raw > 0 ? "+" : "") + v.raw.toFixed(1) + ", where " + p.pos + "s usually sit at " + (v.usual > 0 ? "+" : "") + v.usual.toFixed(1) +
      " → <b>" + (v.delta > 0 ? "+" : "") + v.delta.toFixed(1) + "</b> relative");
    if (p.l16_games < 4) lines.push("Only " + p.l16_games + " game" + (p.l16_games === 1 ? "" : "s") + " of data, so lean on it lightly.");
    var box = document.createElement("div"); box.className = "model";
    box.innerHTML = lines.join("<br>");
    d.appendChild(box);
  }

  var cols = document.createElement("div");
  cols.className = "cols";
  var left = document.createElement("div"), right = document.createElement("div");

  // performance: what the sources said about the game that was played
  var hp = document.createElement("h3");
  hp.innerHTML = "Performance <small>Week " + state.data.through_week + " recaps</small>";
  left.appendChild(hp);
  if (t && t.perf.list.length) {
    var ul = document.createElement("ul"); ul.className = "takes";
    t.perf.list.forEach(function (k) { ul.appendChild(takeItem(k, "performance")); });
    left.appendChild(ul);
  } else {
    left.appendChild(note("No source wrote about him in the Week " + state.data.through_week + " recaps."));
  }

  // matchup: our read of the coming game, then what the previews said
  var m = matchupOf(p);
  var hm = document.createElement("h3");
  hm.innerHTML = "Matchup <small>Week " + state.data.next_week + "</small>";
  right.appendChild(hm);
  var mod = document.createElement("div"); mod.className = "model";
  if (m) {
    mod.innerHTML = "<b>" + m.tier + "</b> · #" + m.rank + " of 32 for " + p.pos + "s · " + (m.home ? "vs " : "@ ") + m.opp +
      " · implied " + m.implied_total.toFixed(1) + " · " + (m.spread > 0 ? "favored by " + m.spread : m.spread < 0 ? "underdog by " + (-m.spread) : "pick'em") +
      " · " + m.opp + " has allowed " + m.opp_allowed.toFixed(1) + " half-PPR pts/game to " + p.pos + "s over its last 8";
  } else mod.textContent = "On bye in Week " + state.data.next_week + ".";
  right.appendChild(mod);
  if (t && t.match.list.length) {
    var hw = document.createElement("h3");
    hw.innerHTML = "Previews <small>Week " + t.match.week + "</small>";
    right.appendChild(hw);
    var ul2 = document.createElement("ul"); ul2.className = "takes";
    t.match.list.forEach(function (k) { ul2.appendChild(takeItem(k, "matchup")); });
    right.appendChild(ul2);
  } else {
    right.appendChild(note("No Week " + state.data.next_week + " previews for him yet."));
  }
  cols.append(left, right);
  d.appendChild(cols);
  return d;
}

function note(text) { var n = document.createElement("div"); n.className = "none"; n.textContent = text; return n; }

/** One take: the source and its normalized tags on one line, what they said below. */
function takeItem(k, kind) {
  var li = document.createElement("li");
  var top = document.createElement("div"); top.className = "top";
  var s = document.createElement("span"); s.className = "src"; s.textContent = k.source;
  s.title = state.sources[k.source] || k.source;
  top.appendChild(s);
  var norm = document.createElement("span"); norm.className = "norm";
  if (kind === "matchup" && k.opp) { var op = document.createElement("span"); op.className = "stance"; op.textContent = k.opp; norm.appendChild(op); }
  if (k.job) { var j = document.createElement("span"); j.className = "job"; j.textContent = k.job; norm.appendChild(j); }
  var tierName = kind === "performance" ? k.usage_tier : k.outlook_tier;
  if (tierName) {
    var c = cell(null, TIER_INDEX[tierName], function () { return (tierName + (kind === "performance" ? " usage" : " outlook")).toUpperCase(); });
    norm.appendChild(c);
  }
  if (k.trend) { var tr = document.createElement("span"); tr.className = "job"; tr.textContent = k.trend; norm.appendChild(tr); }
  if (k.stance) { var st = document.createElement("span"); st.className = "stance"; st.textContent = k.stance; norm.appendChild(st); }
  top.appendChild(norm);
  li.appendChild(top);
  if (kind === "performance" && k.evidence) { var ev = document.createElement("span"); ev.className = "ev"; ev.textContent = k.evidence; li.appendChild(ev); }
  if (k.blurb) { var b = document.createElement("span"); b.className = "blurb"; b.textContent = k.blurb; li.appendChild(b); }
  return li;
}

function renderFoot(n) {
  var d = state.data;
  var seen = {}, defs = [];
  shownPositions().forEach(function (x) {
    state.positions[x].stats.forEach(function (s) {
      if (!seen[s[1]]) { seen[s[1]] = 1; defs.push(s[1] + " = " + s[2].charAt(0).toLowerCase() + s[2].slice(1)); }
    });
  });
  $("foot").innerHTML = n + " shown. " + defs.join(" · ") + ". " +
    "Game cells are coloured against single games, the L16 cell against 16-game averages, so each colour means " +
    "where he'd rank at his position for that window. XFP = expected half-PPR points for the looks he got. " +
    "Matchup ranks all 32 teams per position on opponent points allowed to it (last 8), implied total and spread. " +
    "Score = expected half-PPR next game from these same numbers, weights fit on past seasons and tested on 2024–25, where it " +
    "ordered each week's players a bit better than FP over the last 16 alone; its colour is the player's rank at his position this week. " +
    "The number under it compares the workload blend (25% median + 75% ceiling) with your projection's, relative to the usual gap " +
    "at the position: + means the workload likes him more than your projection does. " +
    "Data built " + d.built.replace("T", " ").replace("Z", " UTC") + " from nflverse; route % and first-read % from Fantasy Points Data.";
}

function renderMeta() {
  var d = state.data, n = {};
  d.players.forEach(function (p) { n[p.pos] = (n[p.pos] || 0) + 1; });
  $("meta").innerHTML = "<span><b>" + d.season + "</b> through Week <b>" + d.through_week + "</b></span>" +
    "<span>matchups Week <b>" + d.next_week + "</b></span><span>" +
    POS_ORDER.map(function (x) { return "<b>" + (n[x] || 0) + "</b> " + x + "s"; }).join(" · ") + "</span>";
}

function setScope(scope) {
  state.scope = scope;
  save("brr:analysis:scope", scope);
  $("scopeSlate").setAttribute("aria-pressed", String(scope === "slate"));
  $("scopeAll").setAttribute("aria-pressed", String(scope === "all"));
  $("slateField").hidden = scope !== "slate";
  $("depthField").hidden = scope === "slate";
  $("sortBoard").hidden = scope !== "slate";
  if (scope === "slate" && state.sort === "score" && !load("brr:analysis:sort", null)) state.sort = "board";
  if (scope !== "slate" && state.sort === "board") state.sort = "score";
  $("sort").value = state.sort;
  var s = currentSlate();
  if (scope === "slate" && s) loadAdded(s).then(render);
  render();
}

function setPos(pos) {
  state.pos = pos;
  save("brr:analysis:pos", pos);
  Array.from($("posSeg").querySelectorAll("button")).forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.pos === pos)); });
  render();
}

// ---------------------------------------------------------------- drag
/* Pointer drag on the grip (mouse and touch alike), arrow keys on a focused grip. */
var drag = null, dragEnded = 0;
function clearMarks() {
  Array.from(document.querySelectorAll(".drop-before, .drop-after")).forEach(function (x) { x.classList.remove("drop-before", "drop-after"); });
}
$("rows").addEventListener("pointerdown", function (e) {
  var g = e.target.closest(".grip");
  if (!g || e.button > 0) return;
  e.preventDefault();
  var row = g.closest(".player-row");
  drag = { pid: row.dataset.pid, row: row, target: null, before: true };
  g.setPointerCapture(e.pointerId);
  row.classList.add("dragging");
  document.body.classList.add("is-dragging");
});
$("rows").addEventListener("pointermove", function (e) {
  if (!drag) return;
  if (e.clientY < 50) window.scrollBy(0, -14);
  else if (e.clientY > window.innerHeight - 50) window.scrollBy(0, 14);
  var hit = document.elementFromPoint(e.clientX, e.clientY);
  var row = hit && hit.closest(".player-row[data-pid]");
  clearMarks();
  if (!row || row === drag.row) { drag.target = null; return; }
  var box = row.getBoundingClientRect();
  drag.target = row.dataset.pid;
  drag.before = e.clientY < box.top + box.height / 2;
  row.classList.add(drag.before ? "drop-before" : "drop-after");
});
function endDrag(commit) {
  if (!drag) return;
  var d = drag;
  drag = null;
  clearMarks();
  d.row.classList.remove("dragging");
  document.body.classList.remove("is-dragging");
  dragEnded = Date.now();                 // the click that follows a drop isn't a tap
  if (commit && d.target) commitMove(d.pid, d.target, d.before);
}
$("rows").addEventListener("pointerup", function () { endDrag(true); });
$("rows").addEventListener("pointercancel", function () { endDrag(false); });

// ---------------------------------------------------------------- boot
$("scopeSlate").addEventListener("click", function () { setScope("slate"); });
$("scopeAll").addEventListener("click", function () { setScope("all"); });
$("posSeg").addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) setPos(b.dataset.pos); });
$("slate").addEventListener("change", function (e) {
  state.slateLabel = e.target.value;
  var s = currentSlate();
  if (s) loadAdded(s).then(render);
  render();
});
$("search").addEventListener("input", function (e) { state.search = e.target.value; render(); });
$("team").addEventListener("change", function (e) { state.team = e.target.value; render(); });
$("sort").addEventListener("change", function (e) { state.sort = e.target.value; save("brr:analysis:sort", state.sort); render(); });
$("depth").addEventListener("change", function (e) { state.depth = e.target.checked; render(); });
function toggle(el) {
  var id = el.dataset.id;
  state.open[id] = !state.open[id];
  render();
}
$("rows").addEventListener("click", function (e) {
  if (e.target.closest(".grip") || Date.now() - dragEnded < 400) return;
  var row = e.target.closest(".player-row");
  if (row) toggle(row);
});
$("rows").addEventListener("keydown", function (e) {
  var g = e.target.closest(".grip");
  if (g) {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    var rows = Array.from(document.querySelectorAll(".player-row[data-pid]"));
    var row = g.closest(".player-row"), at = rows.indexOf(row);
    var next = rows[at + (e.key === "ArrowUp" ? -1 : 1)];
    if (next) commitMove(row.dataset.pid, next.dataset.pid, e.key === "ArrowUp");
    return;
  }
  var r = e.target.closest(".player-row");
  if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(r); }
});
/* The board open in another tab writes the same keys; follow its moves. */
window.addEventListener("storage", function (e) {
  if (!state.data || !e.key) return;
  if (e.key === "brr:proj:nfl") { loadProjections(); render(); return; }
  if (!state.slateLabel) return;
  var s = currentSlate();
  if (e.key === "brr:added:" + state.slateLabel && s) { delete state.pool[s.label]; udCache.label = null; loadAdded(s).then(render); return; }
  if (e.key === "brr:order:" + state.slateLabel || e.key === "brr:cut:" + state.slateLabel) render();
});

(async function boot() {
  try {
    var got = await Promise.all([getJson("analysis/workload.json"), getJson("analysis/takes.json").catch(function () { return { takes: [], sources: {} }; })]);
    state.data = got[0];
    state.positions = state.data.positions;
    state.matchups = state.data.matchups || {};
    state.sources = got[1].sources || {};
    state.takes = (got[1].takes || []).filter(function (t) { return t.season === state.data.season; });
    state.takes.forEach(function (t) { t._key = normName(t.player); });
    state.data.players.forEach(function (p) { p._takes = takesFor(state.takes, normName(p.name), state.data.through_week, state.data.next_week); });
  } catch (err) {
    $("rows").innerHTML = '<div class="empty">Could not load the workload data: ' + err.message + "</div>";
    return;
  }
  var teams = Array.from(new Set(state.data.players.map(function (p) { return p.team; }))).sort();
  teams.forEach(function (t) { var o = document.createElement("option"); o.value = t; o.textContent = t; $("team").appendChild(o); });
  renderMeta();
  loadProjections();
  await loadSlates();
  state.sort = load("brr:analysis:sort", null) || state.sort;
  var pos = load("brr:analysis:pos", "");
  state.pos = POS_ORDER.indexOf(pos) >= 0 ? pos : "";
  Array.from($("posSeg").querySelectorAll("button")).forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.pos === state.pos)); });
  var scope = load("brr:analysis:scope", null) || (state.slates.length ? "slate" : "all");
  setScope(scope === "slate" && state.slates.length ? "slate" : "all");
})();
</script>
</body>
